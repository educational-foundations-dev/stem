const KEY='qorganica_v01_progreso';

const norm=s=>String(s??'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[–—−\s\-]/g,'').trim();
const clone=m=>JSON.parse(JSON.stringify(m));

 return [...grouped.entries()].sort((a,b)=>a[0].localeCompare(b[0],'es')).map(([lab,locs])=>{
  let s=locs.sort((a,b)=>a-b),multi=s.length===1?'':({2:'di',3:'tri',4:'tetra'})[s.length]||`${s.length}-`;

function nameOf(raw){const m=canonical(raw),r=ROOT[m.n]||'?',prefix=groupPrefix(m.branches),branch=prefix?prefix+'-':'';

 if(m.kind==='benzene')return (m.branches.length===1?groupPrefix(m.branches,false):prefix?(prefix+'-'):'')+'benceno';
 if(m.kind==='phenol')return (m.branches.length===1?`${m.branches[0].pos}-`+groupPrefix(m.branches,false):prefix?(prefix+'-'):'')+'fenol';

 if(m.kind==='ketone')return branch+(m.n===3?'propanona':`${r}an-${m.loc}-ona`);

 if(m.kind==='nitrile')return branch+r+'anonitrilo';
 if(m.kind==='amine')return branch+(m.n<=2?r+'anamina':`${r}an-${m.loc}-amina`);

function equivalents(raw,m){const text=norm(raw),target=norm(nameOf(m));if(!text)return false;if(text===target)return true;

}
function graph(m){let nodes=[],edges=[];

 if(m.kind==='alcohol'||m.kind==='phenol'){let o=attached('O',m.kind==='phenol'?0:loc);}
 if(m.kind==='ketone'||m.kind==='aldehyde'||m.kind==='acid'||m.kind==='amide'||m.kind==='ester'){const carbon=['acid','aldehyde','amide','ester'].includes(m.kind)?0:loc;attached('O',carbon,2);if(m.kind==='acid')attached('O',carbon);if(m.kind==='amide')attached('N',carbon);if(m.kind==='ester'){
   let oxygen=attached('O',carbon);let prev=oxygen;for(let j=0;j<m.aux;j++){let c=node('C','external',carbon);bond(prev,c);prev=c;}

}
function valid(g){const sums=g.h.every(x=>Math.abs(x-Math.round(x))<.001&&x>=0&&x<=4);

 while(changed){changed=false;for(let e of g.edges){if(seen.has(e.a)&&!seen.has(e.b)){seen.add(e.b);changed=true;}if(seen.has(e.b)&&!seen.has(e.a)){seen.add(e.a);changed=true;}}}

}
function formula(g){let counts={C:0,H:0,N:0,O:0,F:0,Cl:0,Br:0};for(let v of g.nodes)counts[v.el]++;counts.H+=g.h.reduce((a,b)=>a+b,0);

}
function counts(g){let c={};for(const el of ['C','H','N','O','F','Cl','Br'])c[el]=g.nodes.filter(n=>n.el===el).length; c.H=g.h.reduce((a,b)=>a+b,0);return c;}

function generate(){let candidates=[],seen=new Set();

  if(m.branches.length&&!['cyclo','benzene','phenol'].includes(m.kind)&&maxCPath(g)>m.n)return;
  const k=nameOf(m);if(seen.has(k))return;seen.add(k);candidates.push(m);

  for(let p=2;p<n;p++)for(let len of [1,2])if(len===1||p>=3&&p<=n-2)add(model('alkane',n,1,[{pos:p,len}]));
  for(let p=2;p<n;p++)for(let q=p;q<n;q++)add(model('alkane',n,1,[{pos:p,len:1},{pos:q,len:1}]));

 for(let n=3;n<=10;n++)for(const kind of ['alkene','alkyne'])for(let loc=1;loc<n;loc++)for(let p=2;p<n;p++)add(model(kind,n,loc,[{pos:p,len:1}]));

  add(model('cyclo',n));for(let p=1;p<=n;p++)add(model('cyclo',n,1,[{pos:p,len:1}]));

 for(let p=1;p<=6;p++)for(let q=p+1;q<=6;q++)add(model('benzene',6,1,[{pos:p,len:1},{pos:q,len:1}]));
 add(model('phenol',6));for(let pos=2;pos<=6;pos++)add(model('phenol',6,1,[{pos,len:1}]));
 for(let n=1;n<=10;n++){
  for(let loc=1;loc<=n;loc++){
   add(model('alcohol',n,loc));add(model('amine',n,loc));
   for(const halogen of ['Cl','Br','F'])add(model('halo',n,loc,[],{halogen}));

   add(model('acid',n,1,[{pos,len:1}]));add(model('aldehyde',n,1,[{pos,len:1}]));

const LIB=generate();
const familiesOf=m=>m.branches.length&&['alkane','alkene','alkyne'].includes(m.kind)?[m.kind,'branched']:[m.kind];
function rank(m){

 if(m.kind==='alkane'&&m.n<=4&&m.branches.length===1&&m.branches[0].len===1)return 'basico';
 if(m.branches.length>1||['benzene','phenol','ester','nitrile'].includes(m.kind)||m.n>=8||m.kind==='ether'&&m.loc>1)return 'avanzado';

const ranknum={basico:0,medio:1,avanzado:2};
function candidatesFor(filter,level){let max=ranknum[level];return LIB.filter(m=>(filter==='all'||familiesOf(m).includes(filter))&&ranknum[rank(m)]<=max);}
function pick(filter,level,exclude=[]){let pool=candidatesFor(filter,level);if(!pool.length)pool=candidatesFor(filter,'avanzado');

 if(filter==='all'){let fams=unique(choices.map(m=>m.branches.length&&['alkane','alkene','alkyne'].includes(m.kind)?'branched':m.kind));let selected=one(fams);choices=choices.filter(m=>(m.branches.length&&['alkane','alkene','alkyne'].includes(m.kind)?'branched':m.kind)===selected);}

// Isomorfismo elemental de grafos: corrige el dibujo, sin depender del sentido u orientación.
function isomorphic(A,B){if(!valid(A)||!valid(B)||A.nodes.length!==B.nodes.length||A.edges.length!==B.edges.length)return false;

function positions(G){let m=G.m,ring=['cyclo','benzene','phenol'].includes(m.kind),n=ring&&m.kind!=='cyclo'?6:m.n;

function withHydrogens(G){const pos=positions(G),hydrogens=[],taken=[];

    let sep=[...reserved,...chosen].length?Math.min(...[...reserved,...chosen].map(r=>Math.abs(Math.atan2(Math.sin(a-r),Math.cos(a-r))))):Math.PI;
    let q={x:pos[i].x+52*Math.cos(a),y:pos[i].y+52*Math.sin(a)};
    let collision=pos.filter((p,j)=>j!==i).reduce((sum,p)=>sum+Math.max(0,31-Math.hypot(q.x-p.x,q.y-p.y)),0);

  }
  for(let a of chosen){let q={x:pos[i].x+52*Math.cos(a),y:pos[i].y+52*Math.sin(a),parent:i,el:'H'};hydrogens.push(q);taken.push(q);}
 }

}
function bbox(points,pad=48){let minX=Math.min(...points.map(p=>p.x))-pad,maxX=Math.max(...points.map(p=>p.x))+pad,minY=Math.min(...points.map(p=>p.y))-pad,maxY=Math.max(...points.map(p=>p.y))+pad;return {x:minX,y:minY,w:Math.ceil(maxX-minX),h:Math.ceil(maxY-minY)};}

  return `<line x1="${(a.x+dx*shrink+px*offset).toFixed(1)}" y1="${(a.y+dy*shrink+py*offset).toFixed(1)}" x2="${(b.x-dx*shrink+px*offset).toFixed(1)}" y2="${(b.y-dy*shrink+py*offset).toFixed(1)}" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round"/>`;
 }).join('');}

function graphSVG(G,rep){const developed=rep==='developed',skeletal=rep==='skeletal';let {pos,hydrogens}=withHydrogens(G),pts=developed?pos.concat(hydrogens):pos,bb=bbox(pts,43),html=[];

   html.push(`<text x="${p.x}" y="${p.y+5}" fill="${color}" font-size="${lab.length>3?16:20}" font-weight="${node.el==='C'?780:800}" text-anchor="middle">${esc(lab)}</text>`);
  });
  for(let h of developed?hydrogens:[]){html.push(`<text x="${h.x}" y="${h.y+5}" fill="#657d8d" font-size="18" text-anchor="middle">H</text>`);}
 } else{

   html.push(`<text x="${p.x}" y="${p.y+5}" font-size="19" font-weight="750" text-anchor="middle" fill="${ELEM_COLORS[node.el]}">${esc(lab)}</text>`);
  });
 }
 return `<div class="chem-layout"><svg xmlns="http://www.w3.org/2000/svg" class="chem-svg" style="width:${bb.w}px;height:${bb.h}px;max-width:none;max-height:none" viewBox="0 0 ${bb.w} ${bb.h}" role="img" aria-label="Fórmula ${developed?'desarrollada':skeletal?'esquelética':'semidesarrollada'} de ${esc(nameOf(G.m))}"><g transform="translate(${-bb.x} ${-bb.y})">${html.join('')}</g></svg></div>`;

 let bx=bbox(vertices.map(v=>({x:v.x,y:v.y})),0),scale=Math.min(100,(w-80)/Math.max(2.7,bx.w),(h-65)/Math.max(2.5,bx.h))*rot.zoom;

 for(let e of mod.edges.slice().sort((a,b)=>(mapped[a.a].z+mapped[a.b].z)-(mapped[b.a].z+mapped[b.b].z))){let a=mapped[e.a],b=mapped[e.b],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;

function lessons(){
 const example=(body)=>`<div class="learn-example">${body}</div>`;
 const info=(label,body)=>`<p class="learn-info"><strong>${label}</strong> ${body}</p>`;
 const basics=[
  {k:'01 · ENLACES Y VALENCIAS',t:'Cada carbono completa cuatro enlaces',body:`<p>La formulación comienza contando enlaces. En los compuestos sencillos de esta aplicación, el <strong>carbono completa cuatro enlaces</strong> y el hidrógeno, uno. Un enlace simple cuenta como 1; uno doble, como 2; uno triple, como 3.</p>
  ${example(`<strong>Metano: CH₄</strong> → el carbono se une a cuatro hidrógenos.<br><strong>Etano: CH₃–CH₃</strong> → cada C tiene un enlace C–C y tres C–H.<br><strong>Eteno: CH₂=CH₂</strong> → el enlace C=C cuenta como dos.<br><strong>Etino: CH≡CH</strong> → el enlace C≡C cuenta como tres.`)}
  <p>Al introducir otros elementos, recuerda sus valencias habituales: <strong>O = 2</strong>, <strong>N = 3</strong> (en los ejemplos neutros básicos) y <strong>F, Cl, Br = 1</strong>.</p>
  ${info('Para formular:', 'dibuja primero los enlaces del esqueleto y añade después los hidrógenos que falten para completar las valencias.')}`},
  {k:'02 · LONGITUD DE LA CADENA',t:'El prefijo indica el número de carbonos',body:`<p>El comienzo del nombre depende de los carbonos de la <strong>cadena principal</strong>. Aprende estos diez prefijos: aparecen continuamente en las demás familias.</p>
  <div class="learn-table-wrap"><table class="learn-table"><thead><tr><th>Carbonos</th><th>Prefijo</th><th>Carbonos</th><th>Prefijo</th></tr></thead><tbody>
  <tr><td>1</td><td><strong>met-</strong></td><td>6</td><td><strong>hex-</strong></td></tr>
  <tr><td>2</td><td><strong>et-</strong></td><td>7</td><td><strong>hept-</strong></td></tr>
  <tr><td>3</td><td><strong>prop-</strong></td><td>8</td><td><strong>oct-</strong></td></tr>
  <tr><td>4</td><td><strong>but-</strong></td><td>9</td><td><strong>non-</strong></td></tr>
  <tr><td>5</td><td><strong>pent-</strong></td><td>10</td><td><strong>dec-</strong></td></tr></tbody></table></div>
  ${example(`CH₃–CH₂–CH₃ contiene <strong>3 carbonos</strong> en cadena → <strong>prop-</strong>. Si todos sus enlaces C–C son simples, se llama <strong>propano</strong>.`)}
  ${info('Atención:', 'una ramificación no siempre pertenece a la cadena principal: hay que seleccionar la cadena adecuada antes de contar.')}`},
  {k:'03 · ENLACES Y TERMINACIONES',t:'–ano, –eno y –ino: ¿qué enlace contiene?',body:`<p>En los hidrocarburos sencillos, la terminación indica el tipo de enlace entre carbonos. Es una de las primeras cosas que debemos identificar antes de nombrar.</p>
  ${example(`<strong>–ano · Alcano</strong> · enlaces C–C simples<br>CH₃–CH₂–CH₃ → <strong>propano</strong><br><br><strong>–eno · Alqueno</strong> · incluye un doble enlace C=C<br>CH₂=CH–CH₃ → <strong>propeno</strong><br><br><strong>–ino · Alquino</strong> · incluye un triple enlace C≡C<br>CH≡C–CH₃ → <strong>propino</strong>`)}
  ${info('Para formular:', 'construye la cadena, coloca el tipo de enlace indicado y ajusta los hidrógenos: no se pueden mantener todos los CH₃ al introducir un enlace doble o triple.')}`},
  {k:'04 · LOCALIZADORES',t:'Numera desde el extremo adecuado',body:`<p>Si hay varias posiciones posibles para un doble o triple enlace, necesitamos indicar <strong>dónde comienza</strong>. Se numera desde el extremo que le otorgue el localizador más bajo en estos hidrocarburos sencillos.</p>
  ${example(`CH₂=CH–CH₂–CH₃ → <strong>but-1-eno</strong>.<br>CH₃–CH=CH–CH₃ → <strong>but-2-eno</strong>.<br>CH≡C–CH₂–CH₃ → <strong>but-1-ino</strong>.`)}
  <p>El <strong>1</strong> de but-1-eno indica el primer carbono del enlace doble, no un carbono aislado.</p>
  ${info('Importante:', 'cuando aparezca un grupo funcional principal, la elección de la numeración también tendrá que tenerlo en cuenta; no se aplica una única regla a todas las familias.')}`},
  {k:'05 · RAMIFICACIONES',t:'Las cadenas laterales también se nombran',body:`<p>Una molécula puede tener carbonos que salen de la cadena principal. Se nombran como sustituyentes: <strong>metil</strong> (–CH₃) y <strong>etil</strong> (–CH₂–CH₃).</p>
  ${example(`CH₃–CH(CH₃)–CH₂–CH₃ → <strong>2-metilbutano</strong>.<br>CH₃–CH(CH₃)–CH(CH₃)–CH₃ → <strong>2,3-dimetilbutano</strong>.`)}
  <p>Selecciona la cadena principal adecuada, numérala y escribe <strong>localizador + sustituyente + nombre base</strong>. Si hay dos sustituyentes iguales, usa <strong>di-</strong>; si son distintos, ordénalos alfabéticamente.</p>
  ${info('Para formular:', 'traza la cadena principal y sitúa cada ramificación sobre el carbono indicado; después completa los hidrógenos.')}`},
  {k:'06 · ANILLOS Y AROMÁTICOS',t:'Cadenas cerradas y anillo bencénico',body:`<p>Un <strong>cicloalcano</strong> es una cadena cerrada saturada: se antepone <strong>ciclo-</strong> al nombre del alcano. El <strong>benceno</strong> es aromático y no debe confundirse con un ciclohexano.</p>
  ${example(`Anillo de seis grupos CH₂ → <strong>ciclohexano</strong> (C₆H₁₂).<br>Anillo aromático de seis carbonos → <strong>benceno</strong> (C₆H₆).<br>Un grupo –CH₃ unido al ciclohexano → <strong>metilciclohexano</strong>.`)}
  <p>Si un anillo tiene varios sustituyentes, se emplean localizadores para describir sus posiciones.</p>
  ${info('Para formular:', 'cierra el anillo antes de añadir los sustituyentes; comprueba que ningún carbono exceda su valencia.')}`},
  {k:'07 · MÉTODO DE TRABAJO',t:'Cómo pasar del nombre a la fórmula y al revés',body:`<div class="learn-flows"><div><strong>Para nombrar una estructura</strong><ol><li>Identifica la familia y su grupo característico.</li><li>Elige la cadena principal.</li><li>Numera de acuerdo con la función y las insaturaciones.</li><li>Localiza y nombra los sustituyentes.</li><li>Escribe el nombre completo y revisa los números.</li></ol></div><div><strong>Para formular un nombre</strong><ol><li>Busca el prefijo: te dice cuántos carbonos tiene la base.</li><li>Identifica el sufijo y el grupo funcional.</li><li>Coloca las insaturaciones y sustituyentes indicados.</li><li>Completa los enlaces y los hidrógenos.</li><li>Comprueba la valencia de todos los átomos.</li></ol></div></div>
  ${example(`Una misma molécula puede verse girada o invertida. También puede tener representación <strong>molecular, semidesarrollada, desarrollada o esquelética</strong>. Su conectividad es la que determina qué compuesto es.`)}`}
 ];
 const groups=[
  {k:'08 · ALCOHOLES Y FENOLES',t:'Reconoce el grupo hidroxilo –OH',body:`<p>Los <strong>alcoholes</strong> contienen –OH unido a un carbono no aromático. Se utiliza la terminación <strong>–ol</strong>, con localizador cuando es necesario. Si –OH está unido directamente a un anillo bencénico, hablamos de un <strong>fenol</strong>.</p>

  ${info('Para formular:', 'construye la cadena y sustituye un enlace C–H por C–OH en la posición pedida.')}`},
  {k:'09 · ALDEHÍDOS Y CETONAS',t:'El carbonilo C=O puede estar en dos lugares',body:`<p>Ambos grupos incluyen un carbono con doble enlace a oxígeno (<strong>C=O</strong>). Si se encuentra en el <strong>extremo</strong> como –CHO, el compuesto es un aldehído, con terminación <strong>–al</strong>. Si el carbonilo está <strong>dentro de la cadena</strong>, es una cetona, con terminación <strong>–ona</strong>.</p>
  ${example(`CH₃–CHO → <strong>etanal</strong> (aldehído; –CHO).<br>CH₃–CO–CH₃ → <strong>propanona</strong> (cetona).<br>CH₃–CO–CH₂–CH₃ → <strong>butan-2-ona</strong>.`)}
  ${info('Para formular:', '–CHO siempre incluye un H en el carbono del carbonilo; el carbono carbonílico de una cetona se une a dos carbonos.')}`},
  {k:'10 · ÁCIDOS CARBOXÍLICOS',t:'El grupo –COOH da nombre al ácido',body:`<p>Un ácido carboxílico presenta el grupo <strong>–C(=O)OH</strong>, que se escribe abreviadamente <strong>–COOH</strong>. El nombre comienza con <strong>ácido</strong> y termina en <strong>–oico</strong>.</p>
  ${example(`H–COOH → <strong>ácido metanoico</strong>.<br>CH₃–COOH → <strong>ácido etanoico</strong>.<br>CH₃–CH₂–COOH → <strong>ácido propanoico</strong>.`)}
  ${info('Para nombrar:', 'el carbono del –COOH es el carbono 1 y cuenta dentro del total de carbonos de la cadena.')}
  ${info('Para formular:', 'termina la cadena en –C(=O)OH; no añadas otro carbono aparte si ya has contado el del ácido.')}`},
  {k:'11 · ÉTERES',t:'Un oxígeno une dos fragmentos carbonados',body:`<p>Los éteres sencillos tienen una estructura <strong>R–O–R′</strong>. No presentan un grupo –OH: el oxígeno está enlazado a dos carbonos. En los ejemplos del curso se pueden nombrar mediante el prefijo <strong>alcoxi-</strong> y la cadena principal.</p>
  ${example(`CH₃–O–CH₃ → <strong>metoximetano</strong>.<br>CH₃–O–CH₂–CH₃ → <strong>metoxietano</strong>.`)}
  ${info('Para formular:', 'coloca el oxígeno entre dos fragmentos, nunca como un grupo OH aislado.')}`},
  {k:'12 · ÉSTERES',t:'Combina una parte ácida y una alcohólica',body:`<p>Los ésteres tienen la estructura <strong>R–C(=O)–O–R′</strong>, que suele abreviarse como <strong>R–COO–R′</strong>. Su nombre se construye con la parte que procede del ácido, terminada en <strong>–oato</strong>, seguida de <strong>de + alquilo</strong>.</p>
  ${example(`CH₃–COO–CH₃ → <strong>etanoato de metilo</strong>.<br>CH₃–CH₂–COO–CH₂–CH₃ → <strong>propanoato de etilo</strong>.`)}
  ${info('Para nombrar:', 'identifica primero la cadena del lado del C=O; después nombra el grupo carbonado situado tras el oxígeno.')}
  ${info('Para formular:', 'escribe por separado las dos partes y únelas por –C(=O)–O–, no por un enlace C–C directo.')}`},
  {k:'13 · AMINAS',t:'El grupo amino –NH₂',body:`<p>Las <strong>aminas primarias</strong> que trabajamos presentan <strong>–NH₂</strong> unido a una cadena carbonada. En nomenclatura sustitutiva se utiliza la terminación <strong>–amina</strong> y, cuando procede, un localizador.</p>
  ${example(`CH₃–NH₂ → <strong>metanamina</strong> (también metilamina).<br>CH₃–CH₂–NH₂ → <strong>etanamina</strong>.<br>CH₃–CH(NH₂)–CH₃ → <strong>propan-2-amina</strong>.`)}
  ${info('Para formular:', '–NH₂ aporta un nitrógeno enlazado al carbono y dos hidrógenos. No lo confundas con la función amida.')}`},
  {k:'14 · AMIDAS',t:'La amida contiene –CONH₂',body:`<p>Una <strong>amida primaria</strong> contiene el grupo <strong>–C(=O)NH₂</strong>. Se parece a un ácido carboxílico, pero en lugar de –OH tiene –NH₂ unido al carbono del carbonilo. Se nombra con el sufijo <strong>–amida</strong>.</p>
  ${example(`H–CONH₂ → <strong>metanamida</strong>.<br>CH₃–CONH₂ → <strong>etanamida</strong>.<br>CH₃–CH₂–CONH₂ → <strong>propanamida</strong>.`)}
  ${info('Para nombrar:', 'el carbono del grupo –CONH₂ cuenta como carbono 1 de la cadena principal.')}
  ${info('Para formular:', 'dibuja C=O y después enlaza el mismo carbono a –NH₂.')}`},
  {k:'15 · NITRILOS',t:'El grupo –C≡N',body:`<p>Los <strong>nitrilos</strong> contienen un carbono unido por triple enlace a nitrógeno: <strong>–C≡N</strong>. El nombre de los nitrilos sencillos termina en <strong>–nitrilo</strong>.</p>
  ${example(`CH₃–C≡N → <strong>etanonitrilo</strong>.<br>CH₃–CH₂–C≡N → <strong>propanonitrilo</strong>.`)}
  ${info('Para nombrar:', 'cuenta también el carbono de –C≡N: el CH₃–C≡N tiene dos carbonos, no uno.')}
  ${info('Para formular:', 'el nitrógeno del nitrilo queda al extremo del triple enlace; no es una amina.')}`},
  {k:'16 · DERIVADOS HALOGENADOS',t:'F, Cl y Br actúan como sustituyentes',body:`<p>Los átomos de halógeno sustituyen a un hidrógeno de la cadena. Se nombran con los prefijos <strong>fluoro-</strong>, <strong>cloro-</strong> y <strong>bromo-</strong>, indicando su posición cuando sea necesario.</p>
  ${example(`CH₃–Cl → <strong>clorometano</strong>.<br>CH₃–CH(Cl)–CH₃ → <strong>2-cloropropano</strong>.<br>CH₃–CH₂–Br → <strong>bromoetano</strong>.`)}
  ${info('Para formular:', 'sitúa el halógeno en el carbono indicado y elimina de ese carbono uno de sus hidrógenos para no superar cuatro enlaces.')}`}
 ];
 const card=p=>`<section class="card lesson-card learn-card"><div class="eyebrow">${p.k}</div><h2>${p.t}</h2><div class="learn-content">${p.body}</div></section>`;
 return `${head('Aprende las reglas','De las valencias a los grupos funcionales: aprende a nombrar y a formular con explicaciones, tablas y ejemplos desarrollados.','GUÍA PROGRESIVA · 1.º BACHILLERATO')}
 <div class="learn-section-head"><div class="pill teal">BLOQUE 1</div><div><h2>Las reglas fundamentales</h2><p>Primero comprende los enlaces, la cadena, los localizadores y las ramificaciones. Después aplica el mismo método a todas las familias.</p><a class="learn-jump" href="#grupos-funcionales">Ir a grupos funcionales ↓</a></div></div>
 <div class="lesson-grid">${basics.map(card).join('')}</div>
 <div class="learn-section-head learn-next" id="grupos-funcionales"><div class="pill teal">BLOQUE 2</div><div><h2>Los grupos funcionales</h2><p>Ahora añade O, N o halógenos. Reconoce el grupo característico, aprende qué terminación le corresponde y construye correctamente su estructura.</p></div></div>
 <div class="learn-symbols"><strong>Para leer los esquemas:</strong> R y R′ representan fragmentos carbonados que pueden ser distintos; C=O es un <strong>carbonilo</strong> y –OH es un <strong>hidroxilo</strong>.</div>
 <div class="lesson-grid">${groups.map(card).join('')}</div>
 <div class="card learn-summary"><div><h3>¿Listo para practicar?</h3><p>Recomendación: empieza por <strong>Nombrar</strong> y después pasa a <strong>Formular</strong> sin consultar las soluciones. Puedes elegir la familia y la dificultad.</p></div><div class="btn-row">${button('Practicar nombres →','to-name','primary')}${button('Construir estructuras','to-form')}${button('Explorar moléculas','to-explore')}</div></div>`;
}
function filterBar(mode){const pre=mode==='name'?'name':'form',family=state[pre+'Family'],level=state[pre+'Level'],avail=candidatesFor(family,level).length;
 return `<div class="tool-top"><div class="selector-bar"><div class="field"><label for="${pre}Family">Familia</label><select id="${pre}Family" data-setting="${pre}Family">${familyOptions(family)}</select></div><div class="field"><label for="${pre}Level">Dificultad</label><select id="${pre}Level" data-setting="${pre}Level">${levelOptions(level)}</select></div><div class="filter-count">${avail} compuestos posibles con estos filtros</div></div><span class="stat-chip">${state[mode].attempts} intentos · ${state[mode].hints} pistas</span></div>`;
}
function hintName(m,step){if(step===1){let mapping={alcohol:'Busca un grupo –OH.',acid:'Localiza el grupo –COOH.',aldehyde:'Busca el grupo terminal –CHO.',ketone:'Busca un grupo carbonilo situado dentro de la cadena.',ester:'Identifica el fragmento –COO–.',ether:'Identifica el oxígeno entre dos carbonos.',amine:'Localiza el grupo –NH₂.',amide:'Localiza –CONH₂.',nitrile:'Localiza un triple enlace C≡N.',halo:'Busca un halógeno unido a la cadena.',phenol:'Busca –OH directamente unido al anillo bencénico.'};return mapping[m.kind]||'Identifica la cadena o anillo principal y comprueba si hay enlaces múltiples.';}
 if(step===2)return `El esqueleto principal del nombre tiene <b>${m.n} carbonos</b>${m.kind==='ester'?' en su parte ácida':''}. Distingue los sustituyentes de la cadena.`;
 return m.branches.length?'Numera la cadena o el anillo y ordena alfabéticamente los sustituyentes.':`Comprueba el grupo funcional y el localizador${['alcohol','ketone','amine','halo','ether','alkene','alkyne'].includes(m.kind)?' de su posición':''}.`;
}
function hintForm(m,step){if(step===1)return `Comienza con ${m.n} carbonos en el esqueleto principal${['cyclo','benzene','phenol'].includes(m.kind)?' (anillo)':''}.`;
 if(step===2)return `La familia es <strong>${KIND[m.kind]}</strong>. Usa su grupo característico, si lo hay.`;
 return m.branches.length?`Se necesitan ${m.branches.length} ramificaciones sobre la estructura principal.`:m.kind==='ester'||m.kind==='ether'?`La segunda cadena tiene ${m.aux} carbono${m.aux===1?'':'s'}.`:'Fíjate en los localizadores y comprueba las valencias.';
}
function hintCards(m,s,type){return s.hints?`<div class="hintbox">${Array.from({length:s.hints},(_,i)=>`<p style="margin:2px 0 8px"><b>Pista ${i+1}:</b> ${type==='name'?hintName(m,i+1):hintForm(m,i+1)}</p>`).join('')}</div>`:'';}
function namePage(){const s=state.name,m=s.target,g=graph(m),locked=s.solved||s.revealed;
 return `${head('Aprende a nombrar','Observa la estructura y escribe su nombre. Cambia la representación cuando necesites analizarla mejor.','PRÁCTICA · FÓRMULA → NOMBRE')}<div class="card">${filterBar('name')}<div class="challenge-layout"><div class="stack"><div class="board"><div class="board-head"><span>MOLÉCULA PROPUESTA</span></div>${tabs(state.nameRep,'name',['semi','skeletal','developed'])}<div class="mol-board" id="nameStage">${structure(g,state.nameRep)}</div><span class="sketch-note">No se muestra la fórmula molecular para evitar que sustituya a la interpretación de la estructura.</span></div>
 <form class="stack" id="nameForm" autocomplete="off"><div class="field"><label for="answerName">¿Cómo se llama esta molécula?</label><input id="answerName" spellcheck="false" autocapitalize="off" placeholder="Ej.: propan-2-ol" value="${esc(s.draft)}" ${locked?'disabled':''}></div>
 <div class="btn-row"><button class="btn primary" type="submit" ${locked?'disabled':''}>Comprobar nombre</button><button class="btn" type="button" data-action="name-hint" ${locked||s.hints>=3?'disabled':''}>Pista</button><button class="btn" type="button" data-action="name-reveal" ${locked?'disabled':''}>Ver solución</button>${button('Otro ejercicio →','name-next')}</div></form>${hintCards(m,s,'name')}${msg(s.feedback,s.solved)}
 ${locked?`<div class="mini-panel"><b>Solución:</b> ${nameM(m)} · <b>Fórmula:</b> ${formula(g)}</div>`:''}</div><aside class="card right-panel"><h3>Cómo resolverlo</h3><div class="concept"><strong>1 · Identifica la familia</strong><p>Busca enlaces múltiples, heteroátomos y grupos funcionales.</p></div><div class="concept"><strong>2 · Identifica el esqueleto</strong><p>Cuenta los carbonos y observa la estructura principal.</p></div><div class="concept"><strong>3 · Numera</strong><p>Localiza el grupo principal y los sustituyentes.</p></div><div class="concept"><strong>4 · Nombra</strong><p>Combina prefijos, localizadores y sufijos sin omitir información.</p></div></aside></div></div>`;
}
const FIXED_POSITION=['acid','aldehyde','amide','nitrile','ester','phenol','benzene','cyclo','alkane'];
function editorClean(e){
 if(['benzene','phenol'].includes(e.kind))e.n=6;
 else e.n=Math.min(10,Math.max(['alkene','alkyne','nitrile'].includes(e.kind)?2:['ketone','cyclo'].includes(e.kind)?3:1,e.n));
 if(e.kind==='ketone')e.loc=Math.min(e.n-1,Math.max(2,e.loc));
 else if(['alkene','alkyne'].includes(e.kind))e.loc=Math.min(e.n-1,Math.max(1,e.loc));
 else e.loc=Math.min(e.n,Math.max(1,e.loc));
 if(FIXED_POSITION.includes(e.kind))e.loc=1;
 e.aux=Math.min(e.kind==='ester'?4:2,Math.max(1,e.aux));
 if(e.kind==='ether'&&e.aux>e.n)e.aux=e.n;
 if(!['alkane','alkene','alkyne','cyclo','benzene','phenol','alcohol','aldehyde','acid'].includes(e.kind))e.branches=[];
 e.branches=e.branches.filter(b=>b.pos>=1&&b.pos<=e.n&&b.len>=1&&b.len<=2);
}
function editAtomPreview(e,lock){let g=graph(e),isRing=['cyclo','benzene','phenol'].includes(e.kind),canLoc=!FIXED_POSITION.includes(e.kind)&&!['alkene','alkyne'].includes(e.kind);
 const label=(i)=>{let el='C',h=g.h[i];return h<0?'C!':h===0?'C':h===1?'CH':`CH${sub(h)}`};
 return `<div class="editor-wrap"><div class="editor-cells" aria-label="Constructor de esqueleto de ${e.n} carbonos">${Array.from({length:e.n},(_,i)=>{
  const br=e.branches.filter(b=>b.pos===i+1),lab=br.length===2?'2 × metil':br.length===1?(br[0].len===2?'etil':'metil'):'+ rama';
  const branchEnabled=['alkane','alkene','alkyne','cyclo','benzene','phenol','alcohol','acid','aldehyde'].includes(e.kind);
  return `${i?`<button class="bond-btn ${['alkene','alkyne'].includes(e.kind)&&e.loc===i?'multiple':''}" type="button" ${lock||!['alkene','alkyne'].includes(e.kind)?'disabled':''} data-action="bond-pos" data-index="${i}" title="Colocar el enlace múltiple aquí">${['alkene','alkyne'].includes(e.kind)&&e.loc===i?(e.kind==='alkene'?'=':'≡'):'–'}</button>`:''}
  <div class="edit-atom"><button type="button" class="branch-btn ${br.length?'on':''}" data-action="branch-pos" data-index="${i+1}" ${lock||!branchEnabled?'disabled':''} title="Alternar ramificación sobre este carbono">${lab}</button><button type="button" class="main-carbon ${canLoc&&e.loc===i+1?'chosen':''}" data-action="group-pos" data-index="${i+1}" ${lock||!canLoc?'disabled':''} title="Seleccionar este carbono para el grupo funcional">${label(i)}</button><span class="micro muted">C${i+1}${canLoc&&e.loc===i+1?' · grupo':''}</span></div>`;
 }).join('')}</div></div>
 <div class="editor-tip">${isRing?'El esquema lineal sirve para elegir posiciones; la representación estructural de abajo muestra el anillo. ':'Pulsa «+ rama» para añadir un metil, etil o dos metilos. '}${canLoc?'Pulsa un carbono para situar el grupo funcional. ':''}${['alkene','alkyne'].includes(e.kind)?'Pulsa el enlace donde deba comenzar la insaturación.':''}</div>`;
}
function editorPanel(e,locked){editorClean(e);let G=graph(e),good=valid(G),isRing=['cyclo','benzene','phenol'].includes(e.kind),alkoxy=['ether','ester'].includes(e.kind),canBranches=['alkane','alkene','alkyne','cyclo','benzene','phenol','alcohol','acid','aldehyde'].includes(e.kind);
 return `<div class="editor-layout ${locked?'editor-lock':''}"><div class="control-grid">
  <div class="field"><label for="editKind">Familia o grupo funcional</label><select id="editKind" data-setting="editKind" ${locked?'disabled':''}>${ORDER.filter(k=>k!=='branched').map(k=>`<option value="${k}" ${k===e.kind?'selected':''}>${KIND[k]}</option>`).join('')}</select></div>
  <div class="field"><label for="editSize">Carbonos del esqueleto</label><select id="editSize" data-setting="editSize" ${locked||['benzene','phenol'].includes(e.kind)?'disabled':''}>${Array.from({length:10},(_,i)=>i+1).filter(n=>n>=(['ketone','cyclo'].includes(e.kind)?3:['alkene','alkyne','nitrile'].includes(e.kind)?2:1)).map(n=>`<option ${n===e.n?'selected':''} value="${n}">${n} · ${ROOT[n]}</option>`).join('')}</select></div>
  ${alkoxy?`<div class="field"><label for="editAux">Carbonos de la segunda cadena</label><select id="editAux" data-setting="editAux" ${locked?'disabled':''}>${Array.from({length:e.kind==='ester'?4:Math.min(2,e.n)},(_,i)=>i+1).map(n=>`<option value="${n}" ${e.aux===n?'selected':''}>${n} carbono${n>1?'s':''}</option>`).join('')}</select></div>`:''}
  ${e.kind==='halo'?`<div class="field"><label for="editHalogen">Halógeno</label><select id="editHalogen" data-setting="editHalogen" ${locked?'disabled':''}>${[['Cl','Cloro'],['Br','Bromo'],['F','Fluoro']].map(([v,l])=>`<option value="${v}" ${e.halogen===v?'selected':''}>${l}</option>`).join('')}</select></div>`:''}
  ${!FIXED_POSITION.includes(e.kind)?`<div class="field"><label for="editLoc">${['alkene','alkyne'].includes(e.kind)?'Inicio del enlace múltiple':'Carbono del grupo funcional'}</label><select id="editLoc" data-setting="editLoc" ${locked?'disabled':''}>${Array.from({length:e.n},(_,i)=>i+1).filter(v=>['alkene','alkyne'].includes(e.kind)?v<e.n:e.kind==='ketone'?v>1&&v<e.n:true).map(x=>`<option value="${x}" ${e.loc===x?'selected':''}>Carbono ${x}</option>`).join('')}</select></div>`:''}
 </div>
 <div class="mini-panel"><div class="panel-title">Editor de estructura ${isRing?'— anillo':'— cadena principal'}</div>${editAtomPreview(e,locked)}${!canBranches?'<div class="sketch-note">Esta familia se trabaja sin ramificaciones adicionales en la v0.3.1.</div>':''}</div>
 <div class="mini-panel"><div class="panel-title">Representación de tu molécula</div><div class="mol-board" style="margin-top:10px;min-height:160px">${good?structure(G,'semi'):'<span class="feedback bad">Hay una valencia no permitida; modifica los enlaces o las ramas.</span>'}</div><div class="mol-facts" style="margin-top:12px">${good?`<span>Fórmula: <b>${formula(G)}</b></span><span>Carbonos: <b>${counts(G).C}</b></span>`:'<span>Corrige la valencia para poder comprobar.</span>'}</div></div></div>`;
}
function formPage(){let s=state.form,m=s.target,g=graph(m),locked=s.solved||s.revealed;
 return `${head('Aprende a formular','Lee el nombre propuesto y construye su estructura. La comprobación analiza los átomos y sus enlaces.','PRÁCTICA · NOMBRE → FÓRMULA')}<div class="card">${filterBar('form')}<div class="challenge-layout"><div class="stack"><div class="board"><div class="board-head"><span>NOMBRE PROPUESTO</span><span class="pill teal">Construye la molécula</span></div><div class="answer-box"><div class="answer-name" style="text-align:center">${nameM(m)}</div></div>${editorPanel(s.editor,locked)}</div>
 <div class="btn-row"><button class="btn primary" data-action="form-check" ${locked?'disabled':''}>Comprobar fórmula</button><button class="btn" data-action="form-hint" ${locked||s.hints>=3?'disabled':''}>Pista</button><button class="btn" data-action="form-reveal" ${locked?'disabled':''}>Ver solución</button>${button('Otro ejercicio →','form-next')}</div>
 ${hintCards(m,s,'form')}${msg(s.feedback,s.solved)}${locked?`<div class="mini-panel"><b>Solución de referencia</b> · ${formula(g)}<div class="mol-board" style="margin-top:10px">${structure(g,'semi')}</div></div>`:''}</div>
 <aside class="card right-panel"><h3>Construcción guiada</h3><div class="concept"><strong>1 · Elige la familia</strong><p>Selecciona el tipo de compuesto y el grupo funcional correspondiente.</p></div><div class="concept"><strong>2 · Dibuja el esqueleto</strong><p>Escoge la longitud y sitúa el enlace múltiple si existe.</p></div><div class="concept"><strong>3 · Completa los detalles</strong><p>Indica la posición del grupo funcional y añade las ramificaciones.</p></div><div class="concept"><strong>4 · Comprueba la estructura</strong><p>Las moléculas equivalentes son correctas aunque las hayas dibujado en sentido contrario.</p></div></aside></div></div>`;

 return `${head('Explorador molecular','Alterna entre representaciones de una misma molécula. El modelo 3D es esquemático.','VISUALIZACIÓN DE MOLÉCULAS')}<div class="detail-grid">

 return `${head('Mi progreso','Tus datos se almacenan en este navegador. No necesitas cuenta ni se envían resultados.','SEGUIMIENTO')}<div class="grid-2">${block('Nombrar',a)}${block('Formular',b)}</div><div class="card" style="margin-top:18px"><h3>Familias que has trabajado</h3>${fams.length?`<div class="checklist">${fams.map(x=>`<div class="mol-facts"><span style="min-width:170px">${x.v}</span><span>${x.list.length} ejercicios</span><span>${x.ok.length} resueltos sin revelar</span></div>`).join('')}</div>`:'<p class="small muted">Todavía no has completado ejercicios. Puedes comenzar por los alcanos.</p>'}<div style="margin-top:16px">${button('Borrar historial','erase-progress','sm')}</div></div>`;
}
function logTask(mode,revealed){let s=state[mode];if(s.logged)return;s.logged=true;state.records.push({at:new Date().toISOString(),mode,revealed,first:!revealed&&s.attempts===1&&s.hints===0,family:s.target.kind,name:nameOf(s.target)});storeRecords();}
function nameCheck(){let s=state.name;if(s.solved||s.revealed)return;let val=$('answerName')?.value||'';s.draft=val;if(!val.trim()){s.feedback='Escribe un nombre antes de comprobar.';render();return;}s.attempts++;
 if(equivalents(val,s.target)){s.solved=true;s.feedback=`<strong>¡Correcto!</strong> Has nombrado ${nameM(s.target)}.`;logTask('name',false);}else s.feedback='Aún no es correcto. Revisa la cadena principal, la familia, los localizadores y las ramificaciones. Solicita una pista si lo necesitas.';
 render();if(!s.solved)$('answerName')?.focus();
}
function formCheck(){let s=state.form;if(s.solved||s.revealed)return;s.attempts++;let a=graph(s.editor),b=graph(s.target);
 if(!valid(a))s.feedback='La estructura no cumple las valencias habituales. Revisa los grupos, ramificaciones y enlaces.';
 else if(isomorphic(a,b)){s.solved=true;s.feedback=`<strong>¡Correcto!</strong> La conectividad corresponde a ${nameM(s.target)}. Se aceptan giros, inversiones y numeraciones equivalentes.`;logTask('form',false);}
 else {const A=counts(a),B=counts(b),discrep=Object.keys(A).filter(k=>A[k]!==B[k]);
  if(discrep.length)s.feedback=`Todavía no. La composición atómica es diferente: revisa ${discrep.map(k=>k==='H'?'hidrógenos':k==='C'?'carbonos':k).join(', ')}. Comprueba también los enlaces.`;
  else s.feedback='Tienes la misma fórmula molecular, pero distinta conectividad. Revisa posiciones, ramificaciones y grupos funcionales.';
 }
 render();
}
function updateEditor(action,el){let s=state.form,e=s.editor;if(s.solved||s.revealed)return;
 if(action==='branch-pos'){
  let pos=Number(el.dataset.index),old=e.branches.filter(x=>x.pos===pos);
  e.branches=e.branches.filter(x=>x.pos!==pos);
  if(!old.length)e.branches.push({pos,len:1});
  else if(old.length===1&&old[0].len===1)e.branches.push({pos,len:2});
  else if(old.length===1&&old[0].len===2)e.branches.push({pos,len:1},{pos,len:1});
 }else if(action==='group-pos')e.loc=Number(el.dataset.index);
 else if(action==='bond-pos')e.loc=Number(el.dataset.index);
 editorClean(e);s.feedback='';render();
}
function setEditor(key,value){let s=state.form,e=s.editor;if(s.solved||s.revealed)return;
 if(key==='editKind'){e.kind=value;e.loc=1;e.branches=[];if(['benzene','phenol'].includes(value))e.n=6;}
 if(key==='editSize')e.n=Number(value);
 if(key==='editAux')e.aux=Number(value);
 if(key==='editLoc')e.loc=Number(value);
 if(key==='editHalogen')e.halogen=value;
 editorClean(e);s.feedback='';render();
}
function navigate(page){state.view=page;render();window.scrollTo({top:0,behavior:'instant'});}
function render(){const app=$('app');$('crumb').textContent=NAMES[state.view];document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===state.view);b.setAttribute('aria-current',b.dataset.page===state.view?'page':'false');});
 app.innerHTML=({inicio:home,aprender:lessons,nombrar:namePage,formular:formPage,explorar:explorePage,progreso:progressPage})[state.view]();
 if(state.view==='explorar'&&state.exploreRep==='spatial')requestAnimationFrame(init3D);
}
function act(a,el){if(a.startsWith('to-')){navigate(({ 'to-name':'nombrar','to-form':'formular','to-learn':'aprender','to-explore':'explorar'})[a]);return;}
 if(a==='name-next'||a==='form-next'){newTask(a.startsWith('name')?'name':'form');render();return;}
 if(a==='name-hint'||a==='form-hint'){const s=state[a.startsWith('name')?'name':'form'];s.hints=Math.min(3,s.hints+1);render();return;}
 if(a==='name-reveal'||a==='form-reveal'){
  let mode=a.startsWith('name')?'name':'form',s=state[mode];s.revealed=true;s.feedback=`Solución: <strong>${nameM(s.target)}</strong>. Comprueba los grupos funcionales, los localizadores y la conectividad.`;
  if(mode==='form')s.editor=clone(s.target);logTask(mode,true);render();return;
 }
 if(a==='form-check'){formCheck();return;}
 if(['branch-pos','bond-pos','group-pos'].includes(a)){updateEditor(a,el);return;}
 if(a==='explore-next'){state.explore=pick(state.exploreFamily,'avanzado',[nameOf(state.explore)]);render();return;}
 if(a==='3d-reset'){state.rot={x:-.24,y:.37,zoom:1};paint3D();return;}
 if(a==='erase-progress'){if(confirm('¿Quieres borrar todo tu historial local?')){state.records=[];storeRecords();render();}return;}
}
$('app').addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(el){act(el.dataset.action,el);return;}
 const tab=e.target.closest('[data-rep]');if(tab){if(tab.dataset.context==='name')state.nameRep=tab.dataset.rep;else state.exploreRep=tab.dataset.rep;render();return;}
 let link=e.target.closest('[data-go]');if(link)navigate(link.dataset.go);
});
$('app').addEventListener('keydown',e=>{const link=e.target.closest('[data-go]');if(link&&(e.key==='Enter'||e.key===' ')){e.preventDefault();navigate(link.dataset.go);}});
$('app').addEventListener('submit',e=>{if(e.target.id==='nameForm'){e.preventDefault();nameCheck();}});
$('app').addEventListener('input',e=>{if(e.target.id==='answerName')state.name.draft=e.target.value;});
$('app').addEventListener('change',e=>{
 const key=e.target.dataset.setting,val=e.target.value;if(!key)return;
 if(key==='nameFamily'||key==='nameLevel'){state[key]=val;newTask('name');render();return;}
 if(key==='formFamily'||key==='formLevel'){state[key]=val;newTask('form');render();return;}
 if(key==='exploreFamily'){state.exploreFamily=val;state.explore=pick(val,'avanzado');render();return;}
 if(key==='exploreSelect'){let pool=candidatesFor(state.exploreFamily,'avanzado');state.explore=clone(pool[Number(val)]||pool[0]);render();return;}
 if(key.startsWith('edit')){setEditor(key,val);return;}
});
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
window.addEventListener('resize',()=>{if(state.view==='explorar'&&state.exploreRep==='spatial')paint3D();});
render();

</script>
</body>
</html>
