const clone=m=>JSON.parse(JSON.stringify(m));

function groupPrefix(branches,withLoc=true){
 if(!branches.length)return '';

 return [...grouped.entries()].sort((a,b)=>a[0].localeCompare(b[0],'es')).map(([lab,locs])=>{
  let s=locs.sort((a,b)=>a-b),multi=s.length===1?'':({2:'di',3:'tri',4:'tetra'})[s.length]||`${s.length}-`;

function canonicalRing(m){if(!m.branches.length)return m;
 let entries=[];const n=m.n;
 for(let a=0;a<n;a++)for(const flip of [1,-1]){

function reverseModel(m){let r=clone(m);r.branches=r.branches.map(b=>({...b,pos:m.n+1-b.pos}));if(['alkene','alkyne'].includes(m.kind))r.loc=m.n-m.loc;else r.loc=m.n+1-m.loc;return r;}
function canonical(m){m=clone(m);if(m.kind==='phenol'){m.branches=m.branches.map(b=>({...b,pos:Math.min(b.pos,8-b.pos)}));return m;}
 if(['cyclo','benzene'].includes(m.kind))return canonicalRing(m);
 // Los grupos terminales C(=O), COOH, CONH₂ y CN definen el carbono 1.
 if(['acid','aldehyde','amide','nitrile','ester'].includes(m.kind))return m;
 const r=reverseModel(m);
 function orientScore(x){const loc= ['alkene','alkyne','alcohol','ketone','amine','halo','ether'].includes(x.kind)?x.loc:0;
 const bs=x.branches.map(b=>b.pos).sort((a,b)=>a-b);
 const byAlpha=x.branches.slice().sort((a,b)=>b.len-a.len||a.pos-b.pos).map(b=>b.pos);
 return [loc,...bs,...byAlpha].map(z=>String(z).padStart(2,'0')).join('|');}
 return orientScore(r)<orientScore(m)?r:m;
}
function nameOf(raw){if(raw.kind==='extended')return raw.givenName;const m=canonical(raw),r=ROOT[m.n]||'?',prefix=groupPrefix(m.branches),branch=prefix?prefix+'-':'';
 if(m.kind==='alkane')return branch+r+'ano';
 if(m.kind==='alkene'||m.kind==='alkyne'){let suf=m.kind==='alkene'?'eno':'ino';return branch+(m.n<=3?r+suf:`${r}-${m.loc}-${suf}`);}

 if(m.kind==='benzene')return (m.branches.length===1?groupPrefix(m.branches,false):prefix?(prefix+'-'):'')+'benceno';
 if(m.kind==='phenol')return (m.branches.length===1?`${m.branches[0].pos}-`+groupPrefix(m.branches,false):prefix?(prefix+'-'):'')+'fenol';
 if(m.kind==='alcohol')return branch+(m.n<=2?r+'anol':`${r}an-${m.loc}-ol`);
 if(m.kind==='aldehyde')return branch+r+'anal';
 if(m.kind==='ketone')return branch+(m.n===3?'propanona':`${r}an-${m.loc}-ona`);
 if(m.kind==='acid')return 'ácido '+branch+r+'anoico';
 if(m.kind==='amide')return branch+r+'anamida';
 if(m.kind==='nitrile')return branch+r+'anonitrilo';
 if(m.kind==='amine')return branch+(m.n<=2?r+'anamina':`${r}an-${m.loc}-amina`);
 if(m.kind==='halo'){let p={Cl:'cloro',Br:'bromo',F:'fluoro'}[m.halogen];return `${m.n>=3?m.loc+'-':''}${p}${r}ano`;}
 if(m.kind==='ether'){let a={1:'metoxi',2:'etoxi'}[m.aux];return `${m.n>=3?m.loc+'-':''}${a}${r}ano`;}

}
function equivalents(raw,m){const text=norm(raw),target=norm(nameOf(m));if(!text)return false;if(text===target)return true;if(m.kind==='extended')return (m.aliases||[]).some(a=>norm(a)===text);
 let canonicalName=nameOf(m);
 // «1-buteno» y «3-metil-1-buteno» como variantes docentes habituales.
 let match=canonicalName.match(/^(.*?)(met|et|prop|but|pent|hex|hept|oct|non|dec)-(\d+)-(eno|ino)$/);
 if(match){let alias=match[1]+match[3]+'-'+match[2]+match[4];if(norm(alias)===text)return true;}
 if(['alkene','alkyne'].includes(m.kind)&&m.n<=3&&!m.branches.length&&norm('1-'+canonicalName)===text)return true;

}
function graph(m){if(m.kind==='extended')return extendedGraph(m);let nodes=[],edges=[];
 function node(el,role='main',main=-1){let i=nodes.length;nodes.push({el,role,main});return i;}
 function bond(a,b,o=1){edges.push({a,b,o});}
 let ring=['cyclo','benzene','phenol'].includes(m.kind);
 const n=ring&&m.kind!=='cyclo'?6:m.n;
 for(let i=0;i<n;i++)node('C','main',i);
 if(ring){for(let i=0;i<n;i++)bond(i,(i+1)%n,m.kind==='cyclo'?1:1.5);}
 else for(let i=0;i<n-1;i++)bond(i,i+1,(['alkene','alkyne'].includes(m.kind)&&i===m.loc-1)?m.kind==='alkene'?2:3:1);
 for(let b of m.branches){let p=b.pos-1;for(let j=0;j<b.len;j++){let q=node('C','branch',b.pos-1);bond(p,q);p=q;}}
 function attached(el,to,o=1,role='group'){let p=node(el,role,to);bond(to,p,o);return p;}
 const loc=m.loc-1;
 if(m.kind==='alcohol'||m.kind==='phenol'){let o=attached('O',m.kind==='phenol'?0:loc);}
 if(m.kind==='ketone'||m.kind==='aldehyde'||m.kind==='acid'||m.kind==='amide'||m.kind==='ester'){const carbon=['acid','aldehyde','amide','ester'].includes(m.kind)?0:loc;attached('O',carbon,2);if(m.kind==='acid')attached('O',carbon);if(m.kind==='amide')attached('N',carbon);if(m.kind==='ester'){
   let oxygen=attached('O',carbon);let prev=oxygen;for(let j=0;j<m.aux;j++){let c=node('C','external',carbon);bond(prev,c);prev=c;}
 }}
 if(m.kind==='nitrile')attached('N',0,3);
 if(m.kind==='amine')attached('N',loc);
 if(m.kind==='halo')attached(m.halogen,loc);

function valid(g){const sums=g.h.every(x=>Math.abs(x-Math.round(x))<.001&&x>=0&&x<=4);

 while(changed){changed=false;for(let e of g.edges){if(seen.has(e.a)&&!seen.has(e.b)){seen.add(e.b);changed=true;}if(seen.has(e.b)&&!seen.has(e.a)){seen.add(e.a);changed=true;}}}

function formula(g){let counts={C:0,H:0,N:0,O:0,F:0,Cl:0,Br:0};for(let v of g.nodes)counts[v.el]++;counts.H+=g.h.reduce((a,b)=>a+b,0);

function counts(g){let c={};for(const el of ['C','H','N','O','F','Cl','Br'])c[el]=g.nodes.filter(n=>n.el===el).length; c.H=g.h.reduce((a,b)=>a+b,0);return c;}

function generate(){let candidates=[],seen=new Set();

function extendedGraph(m){

 const bond=(a,b,o=1)=>edges.push({a,b,o}),attach=(el,to,o=1,role='group')=>{const i=node(el,role,to);bond(to,i,o);return i;};
 const n=Math.max(1,Math.floor(m.n||1));for(let i=0;i<n;i++)node('C','main',i);
 for(let i=0;i<n-1;i++)bond(i,i+1,(m.bonds||[])[i]||1);
 for(let b of m.branches||[]){let p=b.pos-1;if(p<0||p>=n)continue;for(let j=0;j<b.len;j++){let x=node('C','branch',p);bond(p,x);p=x;}}
 for(let g of m.groups||[]){let pos=g.pos-1;if(pos<0||pos>=n)continue;
  if(g.type==='OH')attach('O',pos);
  if(g.type==='oxo')attach('O',pos,2);
  if(g.type==='acid'||g.type==='amide'||g.type==='ester'){
   attach('O',pos,2);
   if(g.type==='acid')attach('O',pos);
   if(g.type==='amide')attach('N',pos);
   if(g.type==='ester'){let p=attach('O',pos);for(let k=0;k<(g.len||1);k++){let c=node('C','external',pos);bond(p,c);p=c;}}
  }
  if(g.type==='amino'||g.type==='amineN'){
   const N=attach('N',pos);for(let len of g.alkyls||[]){let p=N;for(let k=0;k<len;k++){let c=node('C','external',pos);bond(p,c);p=c;}}
  }
  if(g.type==='Cl'||g.type==='Br'||g.type==='F')attach(g.type,pos);
  if(g.type==='nitrile')attach('N',pos,3);
 }
 let h=nodes.map((v,i)=>VALENCE[v.el]-edges.filter(e=>e.a===i||e.b===i).reduce((s,e)=>s+e.o,0));
 return {m,nodes,edges,h};
}
function makeExtended(){

 add(3,'prop-2-en-1-ol','unsatfun',orders(3,[[2,2]]),[G(1,'OH')],[],'libro','medio',['prop-2-enol']);

 add(3,'propano-1,3-dial','carbonyls',[],[G(1,'oxo'),G(3,'oxo')],[],'libro','medio',['propanodial']);

 add(3,'propa-1,2-dieno','polyen',orders(3,[[1,2],[2,2]]),[],[],'libro','medio',['propadieno']);
 add(4,'but-3-en-2-ona','unsatfun',orders(4,[[3,2]]),[G(2,'oxo')],[],'libro','medio');
 add(3,'ácido prop-2-enoico','unsatfun',orders(3,[[2,2]]),[G(1,'acid')],[],'libro','medio',['ácido propenoico']);
 add(3,'prop-2-eno-1,3-diol','unsatfun',orders(3,[[2,2]]),[G(1,'OH'),G(3,'OH')],[],'libro','avanzado');

 add(4,'dibutilamina','aminesN',[],[G(1,'amineN',{alkyls:[4]})],[],'libro','avanzado',['N-butilbutan-1-amina']);
 add(1,'trimetilamina','aminesN',[],[G(1,'amineN',{alkyls:[1,1]})],[],'libro','medio',['N,N-dimetilmetanamina']);
 add(7,'2-etil-4-metilhepta-1,3-dien-6-ino','enyn',orders(7,[[1,2],[3,2],[6,3]]),[],[B(2,2),B(4)],'libro','avanzado');
 add(5,'3-metilpent-2-enamida','unsatfun',orders(5,[[2,2]]),[G(1,'amide')],[B(3)],'libro','avanzado');

 // Variaciones propias: polialcoholes con 2 y 3 hidroxilos.

 }
 // Dos o más insaturaciones. Numeración canónica: conjunto de localizadores mínimo;
 // se evita mezclar ramificaciones con selección ambigua de cadena principal.
 for(let n=3;n<=10;n++)for(let p=1;p<n;p++)for(let q=p+1;q<n;q++){
  if(p+q>n)continue;

  add(n,`ácido ${ROOT[n]}anodioico`,'carbonyls',[],[G(1,'acid'),G(n,'acid')],[],'generado','avanzado');

  }
 }

 for(let n=2;n<=7;n++)for(let p=1;p<=n;p++)for(let q=1;q<=n;q++){

const BASE=generate();
const SOURCE_NAMES=new Set(['pentan-1-ol','propan-2-ol','3-metilbutan-2-ol','3-metilbutanal','2-metilbutano','propeno','propano-1-amina','etanoato de propilo','etanoato de metilo','etanamida','pentan-2-ona','butan-2-ona','propanal','ácido propanoico','2,3-dimetilpentano','but-1-eno']);
for(let m of BASE)if(SOURCE_NAMES.has(nameOf(m)))m.source='libro';
const LIB=BASE.concat(makeExtended());
const BOOK=LIB.filter(m=>m.source==='libro');
const familiesOf=m=>{const f=m.kind==='extended'?[m.family,'extended']:m.branches.length&&['alkane','alkene','alkyne'].includes(m.kind)?[m.kind,'branched']:[m.kind];if(m.source==='libro')f.push('book');return f;};
function rank(m){
 if(m.kind==='extended')return m.level||'avanzado';
 const simple=!m.branches.length;
 if(simple&&(m.kind==='benzene'||m.kind==='phenol'||m.kind==='cyclo'&&m.n<=5||m.kind==='ester'&&m.n<=2&&m.aux===1))return 'basico';
 if(simple&&m.n<=3&&(!['ketone'].includes(m.kind)||m.loc===2)&&(!['ether'].includes(m.kind)||m.aux===1))return 'basico';
 if(m.kind==='alkane'&&m.n<=4&&m.branches.length===1&&m.branches[0].len===1)return 'basico';
 if(m.branches.length>1||['benzene','phenol','ester','nitrile'].includes(m.kind)||m.n>=8||m.kind==='ether'&&m.loc>1)return 'avanzado';
 if(m.branches.length||m.n>5||m.loc>1||['acid','amide','ketone','ether','cyclo','halo','amine'].includes(m.kind))return 'medio';
 return 'basico';
}
const ranknum={basico:0,medio:1,avanzado:2};
function candidatesFor(filter,level){let max=ranknum[level];return LIB.filter(m=>(filter==='all'||familiesOf(m).includes(filter))&&ranknum[rank(m)]<=max);}
function pick(filter,level,exclude=[]){let pool=candidatesFor(filter,level);if(!pool.length)pool=candidatesFor(filter,'avanzado');
 let choices=pool.filter(x=>!exclude.includes(nameOf(x)));if(!choices.length)choices=pool;
 if(filter==='all'){let fams=unique(choices.map(m=>m.kind==='extended'?m.family:m.branches.length&&['alkane','alkene','alkyne'].includes(m.kind)?'branched':m.kind==='extended'?m.family:m.kind));let selected=one(fams);choices=choices.filter(m=>(m.kind==='extended'?m.family:m.branches.length&&['alkane','alkene','alkyne'].includes(m.kind)?'branched':m.kind)===selected);}
 return clone(one(choices));
}
// Isomorfismo elemental de grafos: corrige el dibujo, sin depender del sentido u orientación.
function isomorphic(A,B){if(!valid(A)||!valid(B)||A.nodes.length!==B.nodes.length||A.edges.length!==B.edges.length)return false;
 const n=A.nodes.length;
 function matrices(G){let m=Array.from({length:n},()=>Array(n).fill(0));for(const e of G.edges)m[e.a][e.b]=m[e.b][e.a]=e.o;return m;}
 let a=matrices(A),b=matrices(B);
 const sig=(g,M)=>g.nodes.map((node,i)=>node.el+'|'+g.h[i]+'|'+M[i].filter(Boolean).length+'|'+M[i].slice().sort((x,y)=>x-y).join(','));
 let sa=sig(A,a),sb=sig(B,b);if(sa.slice().sort().join(';')!==sb.slice().sort().join(';'))return false;
 let order=[...Array(n).keys()].sort((x,y)=>sa.filter(v=>v===sa[x]).length-sa.filter(v=>v===sa[y]).length);
 let used=new Set(),mapping=new Map();function backtrack(k){if(k===n)return true;let i=order[k];for(let j=0;j<n;j++){
  if(used.has(j)||sa[i]!==sb[j])continue;
  let good=true;for(const [x,y] of mapping)if(a[i][x]!==b[j][y]){good=false;break;}
  if(!good)continue;used.add(j);mapping.set(i,j);if(backtrack(k+1))return true;used.delete(j);mapping.delete(i);
 }return false;}
 return backtrack(0);
}
function positions(G){let m=G.m,ring=['cyclo','benzene','phenol'].includes(m.kind),n=ring&&m.kind!=='cyclo'?6:m.n;
 let pts=Array(G.nodes.length).fill(null);
 if(ring){let radius=n<=4?92:115;for(let i=0;i<n;i++){let t=-Math.PI/2+i*Math.PI*2/n;pts[i]={x:Math.cos(t)*radius,y:Math.sin(t)*radius};}}
 else for(let i=0;i<n;i++)pts[i]={x:(i-(n-1)/2)*92,y:i%2?18:-18};
 let pending=G.nodes.length-n,idx=n;
 while(pending>0){let changed=0;
  for(let i=n;i<G.nodes.length;i++){if(pts[i])continue;
   let edge=G.edges.find(e=>(e.a===i&&pts[e.b])||(e.b===i&&pts[e.a]));if(!edge)continue;
   let parent=edge.a===i?edge.b:edge.a,P=pts[parent],angleCandidates=[];
   if(ring&&parent<n){let t=Math.atan2(P.y,P.x);angleCandidates=[t,t+.48,t-.48,t+Math.PI/2,t-Math.PI/2];}
   else{
    if(parent<n){angleCandidates=[-Math.PI/2,Math.PI/2,-Math.PI/3,Math.PI/3,-Math.PI*2/3,Math.PI*2/3,0,Math.PI];}
    else {let origin=G.edges.find(e=>e.a===parent||e.b===parent);let other=origin?.a===parent?origin.b:origin?.b===parent?origin.a:-1;
     let base=other>=0&&pts[other]?Math.atan2(P.y-pts[other].y,P.x-pts[other].x):0;
     angleCandidates=[base,base+.65,base-.65,base+1.2,base-1.2,base+Math.PI/2,base-Math.PI/2];}
   }
   let best=null,score=-1e9;
   for(let t of angleCandidates){let candidate={x:P.x+Math.cos(t)*80,y:P.y+Math.sin(t)*80};let dist=pts.filter(Boolean).reduce((min,p)=>Math.min(min,Math.hypot(candidate.x-p.x,candidate.y-p.y)),9999);
    let crosses=0;for(let e of G.edges){if(e.a===i||e.b===i||!pts[e.a]||!pts[e.b])continue;let mid={x:(pts[e.a].x+pts[e.b].x)/2,y:(pts[e.a].y+pts[e.b].y)/2};if(Math.hypot(candidate.x-mid.x,candidate.y-mid.y)<32)crosses+=35;}
    let sc=Math.min(dist,100)-crosses-(Math.abs(candidate.y)>235?20:0);
    if(sc>score){score=sc;best=candidate;}
   }pts[i]=best;changed++;
  }if(!changed)break;pending-=changed;
 }
 return pts;
}
function withHydrogens(G){const pos=positions(G),hydrogens=[],taken=[];
 for(let i=0;i<G.nodes.length;i++){
  const neighbors=G.edges.filter(e=>e.a===i||e.b===i).map(e=>e.a===i?e.b:e.a);
  let reserved=neighbors.map(j=>Math.atan2(pos[j].y-pos[i].y,pos[j].x-pos[i].x)),chosen=[];
  const hcount=Math.max(0,Math.round(G.h[i]));
  if(hcount===4&&reserved.length===0)chosen=[0,Math.PI/2,Math.PI,3*Math.PI/2];
  else for(let k=0;k<hcount;k++){
   let best=0,score=-1e10;
   for(let t=0;t<72;t++){let a=t*2*Math.PI/72;
    let sep=[...reserved,...chosen].length?Math.min(...[...reserved,...chosen].map(r=>Math.abs(Math.atan2(Math.sin(a-r),Math.cos(a-r))))):Math.PI;
    let q={x:pos[i].x+52*Math.cos(a),y:pos[i].y+52*Math.sin(a)};
    let collision=pos.filter((p,j)=>j!==i).reduce((sum,p)=>sum+Math.max(0,31-Math.hypot(q.x-p.x,q.y-p.y)),0);
    collision+=taken.reduce((sum,p)=>sum+Math.max(0,27-Math.hypot(q.x-p.x,q.y-p.y)),0);
    const sc=sep*28-collision*1.7;
    if(sc>score){best=a;score=sc;}
   }chosen.push(best);
  }
  for(let a of chosen){let q={x:pos[i].x+52*Math.cos(a),y:pos[i].y+52*Math.sin(a),parent:i,el:'H'};hydrogens.push(q);taken.push(q);}
 }
 return {pos,hydrogens};
}
function bbox(points,pad=48){let minX=Math.min(...points.map(p=>p.x))-pad,maxX=Math.max(...points.map(p=>p.x))+pad,minY=Math.min(...points.map(p=>p.y))-pad,maxY=Math.max(...points.map(p=>p.y))+pad;return {x:minX,y:minY,w:Math.ceil(maxX-minX),h:Math.ceil(maxY-minY)};}
function svgBond(a,b,o=1,skip=0,stroke='#5c7c8b',width=2.5){let dx=b.x-a.x,dy=b.y-a.y,mag=Math.hypot(dx,dy)||1,px=-dy/mag,py=dx/mag,shrink=Math.min(.33,skip/mag);
 let lines=o===3?[-6,0,6]:o===2?[-4,4]:[0];return lines.map(offset=>{
  return `<line x1="${(a.x+dx*shrink+px*offset).toFixed(1)}" y1="${(a.y+dy*shrink+py*offset).toFixed(1)}" x2="${(b.x-dx*shrink+px*offset).toFixed(1)}" y2="${(b.y-dy*shrink+py*offset).toFixed(1)}" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round"/>`;
 }).join('');}
function labelFor(node,h){if(node.el==='C'){if(h<=0)return 'C';return `CH${h>1?'₀₁₂₃₄₅₆₇₈₉'[h]:''}`.replace('₁','');}
 if(node.el==='O')return h===1?'OH':'O';if(node.el==='N')return h===2?'NH₂':h===1?'NH':'N';return node.el;}
function graphSVG(G,rep){const developed=rep==='developed',skeletal=rep==='skeletal';let {pos,hydrogens}=withHydrogens(G),pts=developed?pos.concat(hydrogens):pos,bb=bbox(pts,43),html=[];
 for(let e of G.edges){let o=e.o===1.5?(skeletal?1:(G.edges.indexOf(e)%2===0?2:1)):e.o;html.push(svgBond(pos[e.a],pos[e.b],o,developed?19:(skeletal?(G.nodes[e.a].el==='C'&&G.nodes[e.b].el==='C'?0:15):27),'#547587',developed?2.2:3));}
 // La aromaticidad no se entiende como tres enlaces dobles fijos: se dibuja círculo interno.
 if(['benzene','phenol'].includes(G.m.kind)&&skeletal){const r=G.m.n===6?55:55;html.push(`<circle cx="0" cy="0" r="${r}" fill="none" stroke="#6a98aa" stroke-width="2.3"/>`);}
 if(developed){for(let h of hydrogens){html.push(svgBond(pos[h.parent],h,1,17,'#8da4ae',1.8));}}
 if(!skeletal||developed){
  G.nodes.forEach((node,i)=>{
   let lab=developed?node.el:labelFor(node,G.h[i]),p=pos[i],color=ELEM_COLORS[node.el];
   html.push(`<rect x="${p.x-19}" y="${p.y-17}" width="38" height="34" rx="8" fill="#f8fbfd" fill-opacity=".96"/>`);
   html.push(`<text x="${p.x}" y="${p.y+5}" fill="${color}" font-size="${lab.length>3?16:20}" font-weight="${node.el==='C'?780:800}" text-anchor="middle">${esc(lab)}</text>`);
  });
  for(let h of developed?hydrogens:[]){html.push(`<text x="${h.x}" y="${h.y+5}" fill="#657d8d" font-size="18" text-anchor="middle">H</text>`);}
 } else{
  G.nodes.forEach((node,i)=>{if(node.el==='C'&&G.nodes.length>1)return;let lab=labelFor(node,G.h[i]),p=pos[i];
   html.push(`<rect x="${p.x-23}" y="${p.y-19}" width="46" height="38" rx="7" fill="#f8fbfd"/>`);
   html.push(`<text x="${p.x}" y="${p.y+5}" font-size="19" font-weight="750" text-anchor="middle" fill="${ELEM_COLORS[node.el]}">${esc(lab)}</text>`);
  });
 }
 return `<div class="chem-layout"><svg xmlns="http://www.w3.org/2000/svg" class="chem-svg" style="width:${bb.w}px;height:${bb.h}px;max-width:none;max-height:none" viewBox="0 0 ${bb.w} ${bb.h}" role="img" aria-label="Fórmula ${developed?'desarrollada':skeletal?'esquelética':'semidesarrollada'} de ${esc(nameOf(G.m))}"><g transform="translate(${-bb.x} ${-bb.y})">${html.join('')}</g></svg></div>`;
}
function structure(g,rep){if(!valid(g))return `<div class="feedback bad">La molécula no cumple las valencias habituales. Corrige la estructura.</div>`;
 if(rep==='molecular')return `<div class="result-big mono-chem">${formula(g)}</div>`;
 return graphSVG(g,rep);
}
const REPS={semi:'Semidesarrollada',skeletal:'Esquelética',developed:'Desarrollada',molecular:'Molecular',spatial:'Modelo 3D'};
function tabs(rep,context,options=['semi','skeletal','developed','molecular']){return `<div class="gallery-views">${options.map(k=>`<button class="seg ${rep===k?'active':''}" data-rep="${k}" data-context="${context}" aria-pressed="${rep===k}">${REPS[k]}</button>`).join('')}</div>`;}
function model3D(G){let {pos,hydrogens}=withHydrogens(G),p=pos.concat(hydrogens),box=bbox(pos,0);
 let vertices=p.map((a,i)=>({el:i<G.nodes.length?G.nodes[i].el:'H',x:(a.x-(box.x+box.w/2))/85,y:(a.y-(box.y+box.h/2))/85,z:i<G.nodes.length?((i%3)-1)*.19:((i%2)?-.6:.6)}));
 const edges=G.edges.map(e=>({...e,o:e.o===1.5?1:e.o}));hydrogens.forEach((p,i)=>edges.push({a:p.parent,b:G.nodes.length+i,o:1}));return {vertices,edges};
}
function paint3D(){let cv=$('mol3d');if(!cv)return;let m=state.explore,G=graph(m),mod=model3D(G),rect=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1),w=Math.max(280,rect.width||500),h=320;
 cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);let ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 let rot=state.rot,vertices=mod.vertices.map(a=>{let x=a.x*Math.cos(rot.y)+a.z*Math.sin(rot.y),z=-a.x*Math.sin(rot.y)+a.z*Math.cos(rot.y),y=a.y*Math.cos(rot.x)-z*Math.sin(rot.x),zz=a.y*Math.sin(rot.x)+z*Math.cos(rot.x);return {x,y,z:zz,el:a.el};});
 let bx=bbox(vertices.map(v=>({x:v.x,y:v.y})),0),scale=Math.min(100,(w-80)/Math.max(2.7,bx.w),(h-65)/Math.max(2.5,bx.h))*rot.zoom;
 let mapped=vertices.map(a=>({x:w/2+(a.x-(bx.x+bx.w/2))*scale,y:h/2+(a.y-(bx.y+bx.h/2))*scale,z:a.z,el:a.el}));
 for(let e of mod.edges.slice().sort((a,b)=>(mapped[a.a].z+mapped[a.b].z)-(mapped[b.a].z+mapped[b.b].z))){let a=mapped[e.a],b=mapped[e.b],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
  for(let off of e.o===3?[-4,0,4]:e.o===2?[-3,3]:[0]){ctx.beginPath();ctx.moveTo(a.x+nx*off,a.y+ny*off);ctx.lineTo(b.x+nx*off,b.y+ny*off);ctx.strokeStyle='#a1b4bd';ctx.lineWidth=2.8;ctx.lineCap='round';ctx.stroke();}}
 for(let a of mapped.slice().sort((a,b)=>a.z-b.z)){let radius=(a.el==='H'?7.5:a.el==='Cl'||a.el==='Br'?13:10.5)*Math.max(.55,Math.min(1.15,scale/55));ctx.beginPath();ctx.arc(a.x,a.y,radius,0,Math.PI*2);
  let color=ELEM_COLORS[a.el]||'#344e60';ctx.fillStyle=color==='\u002371879a'?'#f0f3f6':color;ctx.fill();ctx.strokeStyle='#c3d4dc';ctx.lineWidth=1;ctx.stroke();}
}
let drag=null;
function init3D(){const canvas=$('mol3d');if(!canvas)return;paint3D();canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;state.rot.y+=(e.clientX-drag.x)*.013;state.rot.x+=(e.clientY-drag.y)*.013;drag={x:e.clientX,y:e.clientY};paint3D()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();state.rot.zoom=Math.max(.65,Math.min(2,state.rot.zoom+(e.deltaY<0?.09:-.09)));paint3D()},{passive:false});}

function lessons(){
 const example=(body)=>`<div class="learn-example">${body}</div>`;
 const info=(label,body)=>`<p class="learn-info"><strong>${label}</strong> ${body}</p>`;
 const basics=[
  {k:'01 · ENLACES Y VALENCIAS',t:'Cada carbono completa cuatro enlaces',body:`<p>La formulación comienza contando enlaces. En los compuestos sencillos de esta aplicación, el <strong>carbono completa cuatro enlaces</strong> y el hidrógeno, uno. Un enlace simple cuenta como 1; uno doble, como 2; uno triple, como 3.</p>
  ${example(`<strong>Metano: CH₄</strong> → el carbono se une a cuatro hidrógenos.<br><strong>Etano: CH₃–CH₃</strong> → cada C tiene un enlace C–C y tres C–H.<br><strong>Eteno: CH₂=CH₂</strong> → el enlace C=C cuenta como dos.<br><strong>Etino: CH≡CH</strong> → el enlace C≡C cuenta como tres.`)}
  <p>Al introducir otros elementos, recuerda sus valencias habituales: <strong>O = 2</strong>, <strong>N = 3</strong> (en los ejemplos neutros básicos) y <strong>F, Cl, Br = 1</strong>.</p>
  ${info('Para formular:', 'dibuja primero los enlaces del esqueleto y añade después los hidrógenos que falten para completar las valencias.')}`},
  {k:'02 · LONGITUD DE LA CADENA',t:'El prefijo indica el número de carbonos',body:`<p>El comienzo del nombre depende de los carbonos de la <strong>cadena principal</strong>. Aprende estos diez prefijos: aparecen continuamente en las demás familias.</p>
  <div class="learn-table-wrap"><table class="learn-table"><thead><tr><th>Carbonos</th><th>Prefijo</th><th>Carbonos</th><th>Prefijo</th></tr></thead><tbody>
  <tr><td>1</td><td><strong>met-</strong></td><td>6</td><td><strong>hex-</strong></td></tr>
  <tr><td>2</td><td><strong>et-</strong></td><td>7</td><td><strong>hept-</strong></td></tr>
  <tr><td>3</td><td><strong>prop-</strong></td><td>8</td><td><strong>oct-</strong></td></tr>
  <tr><td>4</td><td><strong>but-</strong></td><td>9</td><td><strong>non-</strong></td></tr>
  <tr><td>5</td><td><strong>pent-</strong></td><td>10</td><td><strong>dec-</strong></td></tr></tbody></table></div>
  ${example(`CH₃–CH₂–CH₃ contiene <strong>3 carbonos</strong> en cadena → <strong>prop-</strong>. Si todos sus enlaces C–C son simples, se llama <strong>propano</strong>.`)}
  ${info('Atención:', 'una ramificación no siempre pertenece a la cadena principal: hay que seleccionar la cadena adecuada antes de contar.')}`},
  {k:'03 · ENLACES Y TERMINACIONES',t:'–ano, –eno y –ino: ¿qué enlace contiene?',body:`<p>En los hidrocarburos sencillos, la terminación indica el tipo de enlace entre carbonos. Es una de las primeras cosas que debemos identificar antes de nombrar.</p>
  ${example(`<strong>–ano · Alcano</strong> · enlaces C–C simples<br>CH₃–CH₂–CH₃ → <strong>propano</strong><br><br><strong>–eno · Alqueno</strong> · incluye un doble enlace C=C<br>CH₂=CH–CH₃ → <strong>propeno</strong><br><br><strong>–ino · Alquino</strong> · incluye un triple enlace C≡C<br>CH≡C–CH₃ → <strong>propino</strong>`)}
  ${info('Para formular:', 'construye la cadena, coloca el tipo de enlace indicado y ajusta los hidrógenos: no se pueden mantener todos los CH₃ al introducir un enlace doble o triple.')}`},
  {k:'04 · LOCALIZADORES',t:'Numera desde el extremo adecuado',body:`<p>Si hay varias posiciones posibles para un doble o triple enlace, necesitamos indicar <strong>dónde comienza</strong>. Se numera desde el extremo que le otorgue el localizador más bajo en estos hidrocarburos sencillos.</p>
  ${example(`CH₂=CH–CH₂–CH₃ → <strong>but-1-eno</strong>.<br>CH₃–CH=CH–CH₃ → <strong>but-2-eno</strong>.<br>CH≡C–CH₂–CH₃ → <strong>but-1-ino</strong>.`)}
  <p>El <strong>1</strong> de but-1-eno indica el primer carbono del enlace doble, no un carbono aislado.</p>
  ${info('Importante:', 'cuando aparezca un grupo funcional principal, la elección de la numeración también tendrá que tenerlo en cuenta; no se aplica una única regla a todas las familias.')}`},
  {k:'05 · RAMIFICACIONES',t:'Las cadenas laterales también se nombran',body:`<p>Una molécula puede tener carbonos que salen de la cadena principal. Se nombran como sustituyentes: <strong>metil</strong> (–CH₃) y <strong>etil</strong> (–CH₂–CH₃).</p>
  ${example(`CH₃–CH(CH₃)–CH₂–CH₃ → <strong>2-metilbutano</strong>.<br>CH₃–CH(CH₃)–CH(CH₃)–CH₃ → <strong>2,3-dimetilbutano</strong>.`)}
  <p>Selecciona la cadena principal adecuada, numérala y escribe <strong>localizador + sustituyente + nombre base</strong>. Si hay dos sustituyentes iguales, usa <strong>di-</strong>; si son distintos, ordénalos alfabéticamente.</p>
  ${info('Para formular:', 'traza la cadena principal y sitúa cada ramificación sobre el carbono indicado; después completa los hidrógenos.')}`},
  {k:'06 · ANILLOS Y AROMÁTICOS',t:'Cadenas cerradas y anillo bencénico',body:`<p>Un <strong>cicloalcano</strong> es una cadena cerrada saturada: se antepone <strong>ciclo-</strong> al nombre del alcano. El <strong>benceno</strong> es aromático y no debe confundirse con un ciclohexano.</p>
  ${example(`Anillo de seis grupos CH₂ → <strong>ciclohexano</strong> (C₆H₁₂).<br>Anillo aromático de seis carbonos → <strong>benceno</strong> (C₆H₆).<br>Un grupo –CH₃ unido al ciclohexano → <strong>metilciclohexano</strong>.`)}
  <p>Si un anillo tiene varios sustituyentes, se emplean localizadores para describir sus posiciones.</p>
  ${info('Para formular:', 'cierra el anillo antes de añadir los sustituyentes; comprueba que ningún carbono exceda su valencia.')}`},
  {k:'07 · MÉTODO DE TRABAJO',t:'Cómo pasar del nombre a la fórmula y al revés',body:`<div class="learn-flows"><div><strong>Para nombrar una estructura</strong><ol><li>Identifica la familia y su grupo característico.</li><li>Elige la cadena principal.</li><li>Numera de acuerdo con la función y las insaturaciones.</li><li>Localiza y nombra los sustituyentes.</li><li>Escribe el nombre completo y revisa los números.</li></ol></div><div><strong>Para formular un nombre</strong><ol><li>Busca el prefijo: te dice cuántos carbonos tiene la base.</li><li>Identifica el sufijo y el grupo funcional.</li><li>Coloca las insaturaciones y sustituyentes indicados.</li><li>Completa los enlaces y los hidrógenos.</li><li>Comprueba la valencia de todos los átomos.</li></ol></div></div>
  ${example(`Una misma molécula puede verse girada o invertida. También puede tener representación <strong>molecular, semidesarrollada, desarrollada o esquelética</strong>. Su conectividad es la que determina qué compuesto es.`)}`}
 ];
 const groups=[
  {k:'08 · ALCOHOLES Y FENOLES',t:'Reconoce el grupo hidroxilo –OH',body:`<p>Los <strong>alcoholes</strong> contienen –OH unido a un carbono no aromático. Se utiliza la terminación <strong>–ol</strong>, con localizador cuando es necesario. Si –OH está unido directamente a un anillo bencénico, hablamos de un <strong>fenol</strong>.</p>
  ${example(`CH₃–CH₂–OH → <strong>etanol</strong>.<br>CH₃–CH(OH)–CH₃ → <strong>propan-2-ol</strong>.<br>C₆H₅–OH (OH unido al benceno) → <strong>fenol</strong>.`)}
  ${info('Para nombrar:', 'busca –OH y selecciona una cadena que lo contenga; asigna al grupo el localizador correcto.')}
  ${info('Para formular:', 'construye la cadena y sustituye un enlace C–H por C–OH en la posición pedida.')}`},
  {k:'09 · ALDEHÍDOS Y CETONAS',t:'El carbonilo C=O puede estar en dos lugares',body:`<p>Ambos grupos incluyen un carbono con doble enlace a oxígeno (<strong>C=O</strong>). Si se encuentra en el <strong>extremo</strong> como –CHO, el compuesto es un aldehído, con terminación <strong>–al</strong>. Si el carbonilo está <strong>dentro de la cadena</strong>, es una cetona, con terminación <strong>–ona</strong>.</p>
  ${example(`CH₃–CHO → <strong>etanal</strong> (aldehído; –CHO).<br>CH₃–CO–CH₃ → <strong>propanona</strong> (cetona).<br>CH₃–CO–CH₂–CH₃ → <strong>butan-2-ona</strong>.`)}
  ${info('Para formular:', '–CHO siempre incluye un H en el carbono del carbonilo; el carbono carbonílico de una cetona se une a dos carbonos.')}`},
  {k:'10 · ÁCIDOS CARBOXÍLICOS',t:'El grupo –COOH da nombre al ácido',body:`<p>Un ácido carboxílico presenta el grupo <strong>–C(=O)OH</strong>, que se escribe abreviadamente <strong>–COOH</strong>. El nombre comienza con <strong>ácido</strong> y termina en <strong>–oico</strong>.</p>
  ${example(`H–COOH → <strong>ácido metanoico</strong>.<br>CH₃–COOH → <strong>ácido etanoico</strong>.<br>CH₃–CH₂–COOH → <strong>ácido propanoico</strong>.`)}
  ${info('Para nombrar:', 'el carbono del –COOH es el carbono 1 y cuenta dentro del total de carbonos de la cadena.')}
  ${info('Para formular:', 'termina la cadena en –C(=O)OH; no añadas otro carbono aparte si ya has contado el del ácido.')}`},
  {k:'11 · ÉTERES',t:'Un oxígeno une dos fragmentos carbonados',body:`<p>Los éteres sencillos tienen una estructura <strong>R–O–R′</strong>. No presentan un grupo –OH: el oxígeno está enlazado a dos carbonos. En los ejemplos del curso se pueden nombrar mediante el prefijo <strong>alcoxi-</strong> y la cadena principal.</p>
  ${example(`CH₃–O–CH₃ → <strong>metoximetano</strong>.<br>CH₃–O–CH₂–CH₃ → <strong>metoxietano</strong>.`)}
  ${info('Para formular:', 'coloca el oxígeno entre dos fragmentos, nunca como un grupo OH aislado.')}`},
  {k:'12 · ÉSTERES',t:'Combina una parte ácida y una alcohólica',body:`<p>Los ésteres tienen la estructura <strong>R–C(=O)–O–R′</strong>, que suele abreviarse como <strong>R–COO–R′</strong>. Su nombre se construye con la parte que procede del ácido, terminada en <strong>–oato</strong>, seguida de <strong>de + alquilo</strong>.</p>
  ${example(`CH₃–COO–CH₃ → <strong>etanoato de metilo</strong>.<br>CH₃–CH₂–COO–CH₂–CH₃ → <strong>propanoato de etilo</strong>.`)}
  ${info('Para nombrar:', 'identifica primero la cadena del lado del C=O; después nombra el grupo carbonado situado tras el oxígeno.')}
  ${info('Para formular:', 'escribe por separado las dos partes y únelas por –C(=O)–O–, no por un enlace C–C directo.')}`},
  {k:'13 · AMINAS',t:'El grupo amino –NH₂',body:`<p>Las <strong>aminas primarias</strong> que trabajamos presentan <strong>–NH₂</strong> unido a una cadena carbonada. En nomenclatura sustitutiva se utiliza la terminación <strong>–amina</strong> y, cuando procede, un localizador.</p>
  ${example(`CH₃–NH₂ → <strong>metanamina</strong> (también metilamina).<br>CH₃–CH₂–NH₂ → <strong>etanamina</strong>.<br>CH₃–CH(NH₂)–CH₃ → <strong>propan-2-amina</strong>.`)}
  ${info('Para formular:', '–NH₂ aporta un nitrógeno enlazado al carbono y dos hidrógenos. No lo confundas con la función amida.')}`},
  {k:'14 · AMIDAS',t:'La amida contiene –CONH₂',body:`<p>Una <strong>amida primaria</strong> contiene el grupo <strong>–C(=O)NH₂</strong>. Se parece a un ácido carboxílico, pero en lugar de –OH tiene –NH₂ unido al carbono del carbonilo. Se nombra con el sufijo <strong>–amida</strong>.</p>
  ${example(`H–CONH₂ → <strong>metanamida</strong>.<br>CH₃–CONH₂ → <strong>etanamida</strong>.<br>CH₃–CH₂–CONH₂ → <strong>propanamida</strong>.`)}
  ${info('Para nombrar:', 'el carbono del grupo –CONH₂ cuenta como carbono 1 de la cadena principal.')}
  ${info('Para formular:', 'dibuja C=O y después enlaza el mismo carbono a –NH₂.')}`},
  {k:'15 · NITRILOS',t:'El grupo –C≡N',body:`<p>Los <strong>nitrilos</strong> contienen un carbono unido por triple enlace a nitrógeno: <strong>–C≡N</strong>. El nombre de los nitrilos sencillos termina en <strong>–nitrilo</strong>.</p>
  ${example(`CH₃–C≡N → <strong>etanonitrilo</strong>.<br>CH₃–CH₂–C≡N → <strong>propanonitrilo</strong>.`)}
  ${info('Para nombrar:', 'cuenta también el carbono de –C≡N: el CH₃–C≡N tiene dos carbonos, no uno.')}
  ${info('Para formular:', 'el nitrógeno del nitrilo queda al extremo del triple enlace; no es una amina.')}`},
  {k:'16 · DERIVADOS HALOGENADOS',t:'F, Cl y Br actúan como sustituyentes',body:`<p>Los átomos de halógeno sustituyen a un hidrógeno de la cadena. Se nombran con los prefijos <strong>fluoro-</strong>, <strong>cloro-</strong> y <strong>bromo-</strong>, indicando su posición cuando sea necesario.</p>
  ${example(`CH₃–Cl → <strong>clorometano</strong>.<br>CH₃–CH(Cl)–CH₃ → <strong>2-cloropropano</strong>.<br>CH₃–CH₂–Br → <strong>bromoetano</strong>.`)}
  ${info('Para formular:', 'sitúa el halógeno en el carbono indicado y elimina de ese carbono uno de sus hidrógenos para no superar cuatro enlaces.')}`}
 ];
 const card=p=>`<section class="card lesson-card learn-card"><div class="eyebrow">${p.k}</div><h2>${p.t}</h2><div class="learn-content">${p.body}</div></section>`;
 return `${head('Aprende las reglas','De las valencias a los grupos funcionales: aprende a nombrar y a formular con explicaciones, tablas y ejemplos desarrollados.','GUÍA PROGRESIVA · 1.º BACHILLERATO')}
 <div class="learn-section-head"><div class="pill teal">BLOQUE 1</div><div><h2>Las reglas fundamentales</h2><p>Primero comprende los enlaces, la cadena, los localizadores y las ramificaciones. Después aplica el mismo método a todas las familias.</p><a class="learn-jump" href="#grupos-funcionales">Ir a grupos funcionales ↓</a></div></div>

function hintName(m,step){if(m.kind==='extended'){if(step===1)return 'Localiza las funciones, los enlaces dobles o triples y los sustituyentes sin decidir todavía la cadena.';if(step===2)return `La estructura tiene ${m.n} carbonos en su cadena de referencia. Prioriza el grupo principal.`;return 'Analiza los localizadores y los prefijos di-, tri- o N-, si aparecen.';}if(step===1){let mapping={alcohol:'Busca un grupo –OH.',acid:'Localiza el grupo –COOH.',aldehyde:'Busca el grupo terminal –CHO.',ketone:'Busca un grupo carbonilo situado dentro de la cadena.',ester:'Identifica el fragmento –COO–.',ether:'Identifica el oxígeno entre dos carbonos.',amine:'Localiza el grupo –NH₂.',amide:'Localiza –CONH₂.',nitrile:'Localiza un triple enlace C≡N.',halo:'Busca un halógeno unido a la cadena.',phenol:'Busca –OH directamente unido al anillo bencénico.'};return mapping[m.kind]||'Identifica la cadena o anillo principal y comprueba si hay enlaces múltiples.';}
 if(step===2)return `El esqueleto principal del nombre tiene <b>${m.n} carbonos</b>${m.kind==='ester'?' en su parte ácida':''}. Distingue los sustituyentes de la cadena.`;
 return m.branches.length?'Numera la cadena o el anillo y ordena alfabéticamente los sustituyentes.':`Comprueba el grupo funcional y el localizador${['alcohol','ketone','amine','halo','ether','alkene','alkyne'].includes(m.kind)?' de su posición':''}.`;
}
function hintForm(m,step){if(m.kind==='extended'){if(step===1)return 'Identifica la cadena principal a partir del nombre, incluidos sus carbonos terminales funcionales.';if(step===2)return 'Coloca primero los enlaces dobles y triples; después, los grupos funcionales prioritarios.';return 'Comprueba si debes añadir varias funciones iguales, sustituyentes en N o ramificaciones.';}if(step===1)return `Comienza con ${m.n} carbonos en el esqueleto principal${['cyclo','benzene','phenol'].includes(m.kind)?' (anillo)':''}.`;
 if(step===2)return `La familia es <strong>${KIND[m.kind]}</strong>. Usa su grupo característico, si lo hay.`;
 return m.branches.length?`Se necesitan ${m.branches.length} ramificaciones sobre la estructura principal.`:m.kind==='ester'||m.kind==='ether'?`La segunda cadena tiene ${m.aux} carbono${m.aux===1?'':'s'}.`:'Fíjate en los localizadores y comprueba las valencias.';
}

const FIXED_POSITION=['acid','aldehyde','amide','nitrile','ester','phenol','benzene','cyclo','alkane'];
function editorClean(e){
 if(['benzene','phenol'].includes(e.kind))e.n=6;
 else e.n=Math.min(10,Math.max(['alkene','alkyne','nitrile'].includes(e.kind)?2:['ketone','cyclo'].includes(e.kind)?3:1,e.n));
 if(e.kind==='ketone')e.loc=Math.min(e.n-1,Math.max(2,e.loc));
 else if(['alkene','alkyne'].includes(e.kind))e.loc=Math.min(e.n-1,Math.max(1,e.loc));
 else e.loc=Math.min(e.n,Math.max(1,e.loc));
 if(FIXED_POSITION.includes(e.kind))e.loc=1;
 e.aux=Math.min(e.kind==='ester'?4:2,Math.max(1,e.aux));
 if(e.kind==='ether'&&e.aux>e.n)e.aux=e.n;
 if(!['alkane','alkene','alkyne','cyclo','benzene','phenol','alcohol','aldehyde','acid'].includes(e.kind))e.branches=[];
 e.branches=e.branches.filter(b=>b.pos>=1&&b.pos<=e.n&&b.len>=1&&b.len<=2);
}
function editAtomPreview(e,lock){let g=graph(e),isRing=['cyclo','benzene','phenol'].includes(e.kind),canLoc=!FIXED_POSITION.includes(e.kind)&&!['alkene','alkyne'].includes(e.kind);
 const label=(i)=>{let el='C',h=g.h[i];return h<0?'C!':h===0?'C':h===1?'CH':`CH${sub(h)}`};
 return `<div class="editor-wrap"><div class="editor-cells" aria-label="Constructor de esqueleto de ${e.n} carbonos">${Array.from({length:e.n},(_,i)=>{
  const br=e.branches.filter(b=>b.pos===i+1),lab=br.length===2?'2 × metil':br.length===1?(br[0].len===2?'etil':'metil'):'+ rama';
  const branchEnabled=['alkane','alkene','alkyne','cyclo','benzene','phenol','alcohol','acid','aldehyde'].includes(e.kind);
  return `${i?`<button class="bond-btn ${['alkene','alkyne'].includes(e.kind)&&e.loc===i?'multiple':''}" type="button" ${lock||!['alkene','alkyne'].includes(e.kind)?'disabled':''} data-action="bond-pos" data-index="${i}" title="Colocar el enlace múltiple aquí">${['alkene','alkyne'].includes(e.kind)&&e.loc===i?(e.kind==='alkene'?'=':'≡'):'–'}</button>`:''}
  <div class="edit-atom"><button type="button" class="branch-btn ${br.length?'on':''}" data-action="branch-pos" data-index="${i+1}" ${lock||!branchEnabled?'disabled':''} title="Alternar ramificación sobre este carbono">${lab}</button><button type="button" class="main-carbon ${canLoc&&e.loc===i+1?'chosen':''}" data-action="group-pos" data-index="${i+1}" ${lock||!canLoc?'disabled':''} title="Seleccionar este carbono para el grupo funcional">${label(i)}</button><span class="micro muted">C${i+1}${canLoc&&e.loc===i+1?' · grupo':''}</span></div>`;
 }).join('')}</div></div>
 <div class="editor-tip">${isRing?'El esquema lineal sirve para elegir posiciones; la representación estructural de abajo muestra el anillo. ':'Pulsa «+ rama» para añadir un metil, etil o dos metilos. '}${canLoc?'Pulsa un carbono para situar el grupo funcional. ':''}${['alkene','alkyne'].includes(e.kind)?'Pulsa el enlace donde deba comenzar la insaturación.':''}</div>`;
}
function editorPanel(e,locked){editorClean(e);let G=graph(e),good=valid(G),isRing=['cyclo','benzene','phenol'].includes(e.kind),alkoxy=['ether','ester'].includes(e.kind),canBranches=['alkane','alkene','alkyne','cyclo','benzene','phenol','alcohol','acid','aldehyde'].includes(e.kind);
 return `<div class="editor-layout ${locked?'editor-lock':''}"><div class="control-grid">
  <div class="field"><label for="editKind">Familia o grupo funcional</label><select id="editKind" data-setting="editKind" ${locked?'disabled':''}>${ORDER.filter(k=>!['branched','book','polyol','polyen','enyn','carbonyls','aminesN','unsatfun','mixed'].includes(k)).map(k=>`<option value="${k}" ${k===e.kind?'selected':''}>${KIND[k]}</option>`).join('')}</select></div>
  <div class="field"><label for="editSize">Carbonos del esqueleto</label><select id="editSize" data-setting="editSize" ${locked||['benzene','phenol'].includes(e.kind)?'disabled':''}>${Array.from({length:10},(_,i)=>i+1).filter(n=>n>=(['ketone','cyclo'].includes(e.kind)?3:['alkene','alkyne','nitrile'].includes(e.kind)?2:1)).map(n=>`<option ${n===e.n?'selected':''} value="${n}">${n} · ${ROOT[n]}</option>`).join('')}</select></div>
  ${alkoxy?`<div class="field"><label for="editAux">Carbonos de la segunda cadena</label><select id="editAux" data-setting="editAux" ${locked?'disabled':''}>${Array.from({length:e.kind==='ester'?4:Math.min(2,e.n)},(_,i)=>i+1).map(n=>`<option value="${n}" ${e.aux===n?'selected':''}>${n} carbono${n>1?'s':''}</option>`).join('')}</select></div>`:''}
  ${e.kind==='halo'?`<div class="field"><label for="editHalogen">Halógeno</label><select id="editHalogen" data-setting="editHalogen" ${locked?'disabled':''}>${[['Cl','Cloro'],['Br','Bromo'],['F','Fluoro']].map(([v,l])=>`<option value="${v}" ${e.halogen===v?'selected':''}>${l}</option>`).join('')}</select></div>`:''}
  ${!FIXED_POSITION.includes(e.kind)?`<div class="field"><label for="editLoc">${['alkene','alkyne'].includes(e.kind)?'Inicio del enlace múltiple':'Carbono del grupo funcional'}</label><select id="editLoc" data-setting="editLoc" ${locked?'disabled':''}>${Array.from({length:e.n},(_,i)=>i+1).filter(v=>['alkene','alkyne'].includes(e.kind)?v<e.n:e.kind==='ketone'?v>1&&v<e.n:true).map(x=>`<option value="${x}" ${e.loc===x?'selected':''}>Carbono ${x}</option>`).join('')}</select></div>`:''}
 </div>

}

 return `${head('Aprende a formular','Lee el nombre propuesto y construye su estructura. La comprobación analiza los átomos y sus enlaces.','PRÁCTICA · NOMBRE → FÓRMULA')}<div class="card">${filterBar('form')}<div class="challenge-layout"><div class="stack"><div class="board"><div class="board-head"><span>NOMBRE PROPUESTO</span><span class="pill teal">Construye la molécula</span></div><div class="answer-box"><div class="answer-name" style="text-align:center">${nameM(m)}</div></div>${m.kind==='extended'?advancedEditor(s.editor,locked):editorPanel(s.editor,locked)}</div>

 <aside class="card right-panel"><h3>Construcción guiada</h3><div class="concept"><strong>1 · Elige la familia</strong><p>Selecciona el tipo de compuesto y el grupo funcional correspondiente.</p></div><div class="concept"><strong>2 · Dibuja el esqueleto</strong><p>Escoge la longitud y sitúa el enlace múltiple si existe.</p></div><div class="concept"><strong>3 · Completa los detalles</strong><p>Indica la posición del grupo funcional y añade las ramificaciones.</p></div><div class="concept"><strong>4 · Comprueba la estructura</strong><p>Las moléculas equivalentes son correctas aunque las hayas dibujado en sentido contrario.</p></div></aside></div></div>`;

function progressPage(){let arr=state.records,a=arr.filter(r=>r.mode==='name'),b=arr.filter(r=>r.mode==='form');const block=(title,list)=>`<div class="card"><h3>${title}</h3><div class="stat-number">${list.length}</div><p class="small muted">Ejercicios finalizados</p><div class="facts"><div class="fact"><small>Sin mostrar solución</small><strong>${list.filter(x=>!x.revealed).length}</strong></div><div class="fact"><small>Primera respuesta sin pistas</small><strong>${list.filter(x=>x.first).length}</strong></div></div></div>`;
 const fams=Object.entries(KIND).map(([k,v])=>{let list=arr.filter(x=>x.family===k),ok=list.filter(x=>!x.revealed);return {k,v,list,ok};}).filter(x=>x.list.length).sort((x,y)=>y.list.length-x.list.length).slice(0,10);
 return `${head('Mi progreso','Tus datos se almacenan en este navegador. No necesitas cuenta ni se envían resultados.','SEGUIMIENTO')}<div class="grid-2">${block('Nombrar',a)}${block('Formular',b)}</div><div class="card" style="margin-top:18px"><h3>Familias que has trabajado</h3>${fams.length?`<div class="checklist">${fams.map(x=>`<div class="mol-facts"><span style="min-width:170px">${x.v}</span><span>${x.list.length} ejercicios</span><span>${x.ok.length} resueltos sin revelar</span></div>`).join('')}</div>`:'<p class="small muted">Todavía no has completado ejercicios. Puedes comenzar por los alcanos.</p>'}<div style="margin-top:16px">${button('Borrar historial','erase-progress','sm')}</div></div>`;
}
function logTask(mode,revealed){let s=state[mode];if(s.logged)return;s.logged=true;state.records.push({at:new Date().toISOString(),mode,revealed,first:!revealed&&s.attempts===1&&s.hints===0,family:s.target.kind,name:nameOf(s.target)});storeRecords();}
function nameCheck(){let s=state.name;if(s.solved||s.revealed)return;let val=$('answerName')?.value||'';s.draft=val;if(!val.trim()){s.feedback='Escribe un nombre antes de comprobar.';render();return;}s.attempts++;
 if(equivalents(val,s.target)){s.solved=true;s.feedback=`<strong>¡Correcto!</strong> Has nombrado ${nameM(s.target)}.`;logTask('name',false);}else s.feedback='Aún no es correcto. Revisa la cadena principal, la familia, los localizadores y las ramificaciones. Solicita una pista si lo necesitas.';
 render();if(!s.solved)$('answerName')?.focus();
}
function formCheck(){let s=state.form;if(s.solved||s.revealed)return;s.attempts++;let a=graph(s.editor),b=graph(s.target);
 if(!valid(a))s.feedback='La estructura no cumple las valencias habituales. Revisa los grupos, ramificaciones y enlaces.';
 else if(isomorphic(a,b)){s.solved=true;s.feedback=`<strong>¡Correcto!</strong> La conectividad corresponde a ${nameM(s.target)}. Se aceptan giros, inversiones y numeraciones equivalentes.`;logTask('form',false);}
 else {const A=counts(a),B=counts(b),discrep=Object.keys(A).filter(k=>A[k]!==B[k]);
  if(discrep.length)s.feedback=`Todavía no. La composición atómica es diferente: revisa ${discrep.map(k=>k==='H'?'hidrógenos':k==='C'?'carbonos':k).join(', ')}. Comprueba también los enlaces.`;
  else s.feedback='Tienes la misma fórmula molecular, pero distinta conectividad. Revisa posiciones, ramificaciones y grupos funcionales.';
 }
 render();
}
function updateEditor(action,el){let s=state.form,e=s.editor;if(s.solved||s.revealed)return;
 if(action==='branch-pos'){
  let pos=Number(el.dataset.index),old=e.branches.filter(x=>x.pos===pos);
  e.branches=e.branches.filter(x=>x.pos!==pos);
  if(!old.length)e.branches.push({pos,len:1});
  else if(old.length===1&&old[0].len===1)e.branches.push({pos,len:2});
  else if(old.length===1&&old[0].len===2)e.branches.push({pos,len:1},{pos,len:1});
 }else if(action==='group-pos')e.loc=Number(el.dataset.index);
 else if(action==='bond-pos')e.loc=Number(el.dataset.index);
 editorClean(e);s.feedback='';render();
}
function setEditor(key,value){let s=state.form,e=s.editor;if(s.solved||s.revealed)return;
 if(key==='editKind'){e.kind=value;e.loc=1;e.branches=[];if(['benzene','phenol'].includes(value))e.n=6;}
 if(key==='editSize')e.n=Number(value);
 if(key==='editAux')e.aux=Number(value);
 if(key==='editLoc')e.loc=Number(value);
 if(key==='editHalogen')e.halogen=value;
 editorClean(e);s.feedback='';render();
}

function render(){const app=$('app');$('crumb').textContent=NAMES[state.view];document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===state.view);b.setAttribute('aria-current',b.dataset.page===state.view?'page':'false');});
 app.innerHTML=({inicio:home,aprender:lessons,nombrar:namePage,formular:formPage,explorar:explorePage,biblioteca:libraryPage,propiedades:propertiesPage,progreso:progressPage})[state.view]();
 if(state.view==='explorar'&&state.exploreRep==='spatial')requestAnimationFrame(init3D);

function act(a,el){if(a.startsWith('to-')){navigate(({ 'to-name':'nombrar','to-form':'formular','to-learn':'aprender','to-explore':'explorar','to-library':'biblioteca','to-properties':'propiedades'})[a]);return;}
 if(a==='name-next'||a==='form-next'){newTask(a.startsWith('name')?'name':'form');render();return;}
 if(a==='name-hint'||a==='form-hint'){const s=state[a.startsWith('name')?'name':'form'];s.hints=Math.min(3,s.hints+1);render();return;}
 if(a==='name-reveal'||a==='form-reveal'){
  let mode=a.startsWith('name')?'name':'form',s=state[mode];s.revealed=true;s.feedback=`Solución: <strong>${nameM(s.target)}</strong>. Comprueba los grupos funcionales, los localizadores y la conectividad.`;
  if(mode==='form')s.editor=clone(s.target);logTask(mode,true);render();return;
 }
 if(a==='form-check'){formCheck();return;}
 if(a==='library-clear'){state.libraryFamily='all';state.librarySource='all';state.libraryLevel='all';state.librarySort='easy';state.libraryQuery='';state.libraryPage=1;render();return;}
 if(['lib-first','lib-prev','lib-next','lib-last'].includes(a)){const total=Math.max(1,Math.ceil(libraryChoices().length/LIBRARY_SIZE));
  state.libraryPage=a==='lib-first'?1:a==='lib-last'?total:a==='lib-prev'?Math.max(1,state.libraryPage-1):Math.min(total,state.libraryPage+1);
  render();document.querySelector('.library-filter-wrap')?.scrollIntoView({block:'start',behavior:'instant'});return;}
 if(a.startsWith('lib-name-')||a.startsWith('lib-form-')||a.startsWith('lib-explore-')){
  let [_,mode,index]=a.split('-'),item=LIB[Number(index)];if(!item)return;
  if(mode==='explore'){state.exploreFamily=item.source==='libro'?'book':(item.kind==='extended'?item.family:item.kind);state.explore=clone(item);navigate('explorar');return;}
  let md=mode==='name'?'name':'form';state[md]={target:clone(item),editor:blankEditor(item),draft:'',attempts:0,hints:0,solved:false,revealed:false,logged:false,feedback:''};navigate(md==='name'?'nombrar':'formular');return;
 }
 if(a==='library-name'||a==='library-form'){let mode=a==='library-name'?'name':'form';state[mode+'Family']='book';state[mode+'Level']='avanzado';newTask(mode);navigate(mode==='name'?'nombrar':'formular');return;}
 if(a.startsWith('book-')){let parts=a.split('-'),item=BOOK[Number(parts[2])];if(!item)return;if(parts[1]==='explore'){state.exploreFamily='book';state.explore=clone(item);navigate('explorar');return;}let md=parts[1]==='name'?'name':'form';state[md]={target:clone(item),editor:blankEditor(item),draft:'',attempts:0,hints:0,solved:false,revealed:false,logged:false,feedback:''};navigate(md==='name'?'nombrar':'formular');return;}
 if(['branch-pos','bond-pos','group-pos'].includes(a)){updateEditor(a,el);return;}
 if(a==='explore-next'){state.explore=pick(state.exploreFamily,'avanzado',[nameOf(state.explore)]);render();return;}
 if(a==='3d-reset'){state.rot={x:-.24,y:.37,zoom:1};paint3D();return;}
 if(a==='erase-progress'){if(confirm('¿Quieres borrar todo tu historial local?')){state.records=[];storeRecords();render();}return;}
}

function advancedGroupOptions(v){const opts=[['none','Sin grupo'],['OH','–OH · alcohol'],['oxo','=O · carbonilo'],['acid','–COOH · ácido'],['amide','–CONH₂ · amida'],['ester1','–COO–CH₃ · éster'],['ester2','–COO–CH₂CH₃ · éster'],['amino','–NH₂ · amina'],['amine1','–NH–CH₃ · metilamina N'],['amine2','–N(CH₃)₂ · dimetilamina N'],['amine3','–NH–CH₂CH₃'],['amine4','–NH–CH₂CH₂CH₃'],['amine5','–NH–(CH₂)₃CH₃'],['amine6','–N(CH₂CH₃)₂'],['Cl','–Cl'],['Br','–Br'],['F','–F']];return opts.map(([k,t])=>`<option value="${k}" ${v===k?'selected':''}>${t}</option>`).join('');}
function codeGroup(g){if(!g)return 'none';if(g.type==='ester')return 'ester'+(g.len||1);if(g.type==='amineN')return (g.alkyls||[]).length===2?((g.alkyls[0]===2&&g.alkyls[1]===2)?'amine6':'amine2'):'amine'+({1:1,2:3,3:4,4:5}[g.alkyls?.[0]]||1);return g.type;}
function parseGroup(v,pos){if(v==='none')return null;if(v==='ester1'||v==='ester2')return {pos,type:'ester',len:Number(v.at(-1))};if(v.startsWith('amine')&&v!=='amino'){let z=Number(v.slice(5));return {pos,type:'amineN',alkyls:z===2?[1,1]:z===6?[2,2]:[z===1?1:z===3?2:z===4?3:4]};}return {pos,type:v};}
function advancedEditor(e,locked){let g=graph(e),good=valid(g),n=e.n;
 return `<div class="advanced-shell"><div class="advanced-intro"><strong>Constructor avanzado de estructuras</strong><span>Selecciona los enlaces entre carbonos y los grupos sobre cada carbono. Comprueba valencias antes de validar.</span></div>
 <div class="field advanced-size"><label for="advSize">Carbonos de la cadena principal</label><select id="advSize" data-setting="advSize" ${locked?'disabled':''}>${Array.from({length:10},(_,i)=>i+1).map(v=>`<option value="${v}" ${n===v?'selected':''}>${v} carbonos</option>`).join('')}</select></div>
 <div class="adv-scroll"><div class="advanced-cells">${Array.from({length:n},(_,i)=>{
 const j=i+1,b=e.branches.filter(x=>x.pos===j),branch=b.length===2?'2m':b.length===1?String(b[0].len):'0';
 const group=e.groups.find(x=>x.pos===j),gt=codeGroup(group);
 return `<div class="advanced-cell"><div class="advanced-num">C${j}</div>
  <div class="field"><label for="advGroup${j}">Grupo</label><select id="advGroup${j}" data-setting="advGroup${j}" ${locked?'disabled':''}>${advancedGroupOptions(gt)}</select></div>
  <div class="field"><label for="advBranch${j}">Rama</label><select id="advBranch${j}" data-setting="advBranch${j}" ${locked?'disabled':''}><option value="0" ${branch==='0'?'selected':''}>Ninguna</option><option value="1" ${branch==='1'?'selected':''}>Metil</option><option value="2" ${branch==='2'?'selected':''}>Etil</option><option value="2m" ${branch==='2m'?'selected':''}>2 metil</option></select></div>
  ${i<n-1?`<div class="field"><label for="advBond${j}">Enlace C${j}–C${j+1}</label><select id="advBond${j}" data-setting="advBond${j}" ${locked?'disabled':''}>${[[1,'Simple —'],[2,'Doble ='],[3,'Triple ≡']].map(([v,l])=>`<option value="${v}" ${e.bonds[i]===v?'selected':''}>${l}</option>`).join('')}</select></div>`:''}</div>`;
 }).join('')}</div></div><div class="mini-panel"><div class="panel-title">Vista previa de tu estructura</div>
  ${good?`<div class="mol-board">${structure(g,'semi')}</div><div class="mol-facts"><span>Fórmula: <b>${formula(g)}</b></span><span>Carbonos: <b>${counts(g).C}</b></span></div>`:`<div class="feedback bad">Hay carbonos que superan cuatro enlaces, o nitrógenos y oxígenos con valencia incompatible. Revisa grupos, ramificaciones y enlaces.</div>`}</div></div>`;
}
function setAdvanced(key,value){const s=state.form,e=s.editor;if(s.solved||s.revealed||e.kind!=='extended')return;
 if(key==='advSize'){e.n=Math.min(10,Math.max(1,Number(value)));e.bonds=Array.from({length:e.n-1},(_,i)=>e.bonds[i]||1);e.branches=e.branches.filter(b=>b.pos<=e.n);e.groups=e.groups.filter(g=>g.pos<=e.n);}
 else{let match=key.match(/^adv(Bond|Group|Branch)(\d+)$/);if(!match)return;let [_,what,point]=match,idx=Number(point),at=idx-1;
 if(what==='Bond')e.bonds[at]=Number(value);
 if(what==='Group'){e.groups=e.groups.filter(g=>g.pos!==idx);let g=parseGroup(value,idx);if(g)e.groups.push(g);}
 if(what==='Branch'){e.branches=e.branches.filter(b=>b.pos!==idx);if(value==='1'||value==='2')e.branches.push({pos:idx,len:Number(value)});if(value==='2m')e.branches.push({pos:idx,len:1},{pos:idx,len:1});}
 }s.feedback='';render();
}
// Banco íntegro y estable: se muestran 24 estructuras por página para no saturar la pantalla.
const LIBRARY_SIZE=24;
const LIBRARY_ITEMS=LIB.map((m,index)=>({m,index,name:nameOf(m),search:norm(nameOf(m)),
 category:m.kind==='extended'?m.family:m.kind,level:rank(m),source:m.source==='libro'?'libro':'generado',
 families:familiesOf(m),complexity:(m.n||0)+(m.branches?.length||0)*2+
 (m.groups?.length||0)*3+(m.bonds||[]).filter(x=>x>1).length*3}));
const LEVEL_LABEL={basico:'Inicial',medio:'Intermedio',avanzado:'Avanzado'};
function libraryChoices(){const f=state.libraryFamily,src=state.librarySource,lvl=state.libraryLevel,q=norm(state.libraryQuery);
 const arr=LIBRARY_ITEMS.filter(x=>(f==='all'||x.families.includes(f))&&(src==='all'||x.source===src)&&
 (lvl==='all'||x.level===lvl)&&(!q||x.search.includes(q)||norm(KIND[x.category]||'').includes(q)||
 (x.m.aliases||[]).some(y=>norm(y).includes(q))));
 if(state.librarySort==='alpha')arr.sort((a,b)=>a.name.localeCompare(b.name,'es'));
 else if(state.librarySort==='family')arr.sort((a,b)=>ORDER.indexOf(a.category)-ORDER.indexOf(b.category)||ranknum[a.level]-ranknum[b.level]||a.complexity-b.complexity||a.name.localeCompare(b.name,'es'));
 else arr.sort((a,b)=>ranknum[a.level]-ranknum[b.level]||ORDER.indexOf(a.category)-ORDER.indexOf(b.category)||a.complexity-b.complexity||a.name.localeCompare(b.name,'es'));
 return arr;
}

 <div class="field"><label for="librarySort">Ordenar</label><select id="librarySort" data-setting="librarySort">${[['easy','De fácil a complejo'],['family','Por familia'],['alpha','Nombre (A–Z)']].map(([k,v])=>opt(k,v,state.librarySort)).join('')}</select></div>
 </div><div class="library-filter-meta"><span><strong>${results.length}</strong> de ${LIB.length} compuestos · <strong>${BOOK.length}</strong> identificados como ejemplos del libro</span><div class="btn-row">${button('Quitar filtros','library-clear','sm')}${button('Practicar el libro · Nombrar','library-name','sm')}${button('Practicar el libro · Formular','library-form','sm')}</div></div></section>`;
 const cards=current.map(x=>{let G=graph(x.m),family=KIND[x.category]||'Combinado';return `<article class="card library-card"><div class="eyebrow">${esc(family)} · ${LEVEL_LABEL[x.level]} · ${x.source==='libro'?'Del libro':'Generado'}</div><h3 class="library-name">${esc(x.name)}</h3><div class="library-preview">${structure(G,'semi')}</div><div class="mol-facts"><span>${formula(G)}</span><span>${counts(G).C} C · ${LEVEL_LABEL[x.level]}</span></div><div class="btn-row">${button('Nombrar','lib-name-'+x.index,'sm')}${button('Formular','lib-form-'+x.index,'sm')}${button('Explorar','lib-explore-'+x.index,'sm')}</div></article>`;}).join('');
 const pagination=pages<=1?'':`<nav class="library-pagination" aria-label="Páginas de biblioteca">${button('« Primera','lib-first','sm')}${button('‹ Anterior','lib-prev','sm')}<span class="pagination-label">Página ${state.libraryPage} de ${pages} · ${from+1}–${Math.min(from+LIBRARY_SIZE,results.length)}</span>${button('Siguiente ›','lib-next','sm')}${button('Última »','lib-last','sm')}</nav>`;
 return `${head('Biblioteca de compuestos','Consulta y practica el banco completo. Filtra por familia, origen y dificultad y elige un compuesto concreto.','CATÁLOGO · 4.º ESO / 1.º BACHILLERATO')}${selector}${results.length?`${pagination}<div class="library-grid">${cards}</div>${pagination}`:'<div class="card library-empty"><h3>No hay coincidencias</h3><p>Prueba con otra familia, un nivel diferente o un término de búsqueda más corto.</p>'+button('Mostrar todos los compuestos','library-clear','primary')+'</div>'}`;

 ['Hidrocarburos','benzene','Aromáticos','Sus anillos presentan estabilidad aromática; reaccionan frecuentemente por sustitución. Muchos son poco solubles en agua y algunos, como el benceno, son peligrosos para la salud.','Benceno (materia prima industrial), tolueno (disolventes y síntesis de productos químicos).'],
 ['Halogenados','halo','Derivados halogenados','La sustitución de H por halógenos modifica polaridad, densidad, volatilidad y reactividad. Sus propiedades ambientales y toxicológicas varían mucho.','Cloruro de vinilo (PVC para tuberías y cables), tetrafluoroeteno (PTFE/Teflón para recubrimientos).'],
 ['Oxigenados','alcohol','Alcoholes','Contienen –OH; los de baja masa molecular forman puentes de hidrógeno y suelen mezclarse bien con agua. Algunos se oxidan; muchos son inflamables.','Etanol (desinfectantes y bebidas), propan-2-ol (limpieza), glicerina (cosmética).'],
 ['Oxigenados','phenol','Fenoles','El –OH está unido a un anillo aromático. Son más ácidos que los alcoholes alifáticos; pueden formar puentes de hidrógeno.','Fenol (resinas y plásticos), timol (productos antisépticos).'],
 ['Oxigenados','ether','Éteres','Tienen R–O–R y son moderadamente polares. Aceptan puentes de hidrógeno del agua, pero no los donan; muchos son volátiles e inflamables.','Éter dietílico (disolvente), dimetiléter (propelente de aerosoles).'],
 ['Oxigenados','aldehyde','Aldehídos','El carbonilo terminal –CHO es polar y suele reaccionar con facilidad en oxidaciones y adiciones. Los de cadena corta presentan cierta solubilidad en agua.','Metanal / formaldehído (fabricación de resinas), benzaldehído (aroma de almendra).'],
 ['Oxigenados','ketone','Cetonas','El carbonilo interno C=O es polar. Las pequeñas son miscibles o bastante solubles en agua y suelen ser buenos disolventes.','Propanona / acetona (disolvente y quitaesmaltes), butanona (disolvente industrial).'],
 ['Oxigenados','acid','Ácidos carboxílicos','El grupo –COOH es ácido y muy polar; forma puentes de hidrógeno. Los de cadena corta se mezclan bien con agua y reaccionan con bases.','Ácido etanoico / acético (vinagre), ácido benzoico (conservante alimentario).'],
 ['Oxigenados','ester','Ésteres','Tienen –COO–, son moderadamente polares y pueden hidrolizarse. Muchos presentan olores característicos, aunque no todos.','Etanoato de etilo (disolvente), acetato de isoamilo (aroma de plátano), triglicéridos (aceites y grasas).'],
 ['Nitrogenados','amine','Aminas','Generalmente básicas por el par libre del nitrógeno; las de cadena corta suelen ser solubles en agua. Algunas tienen olores intensos.','Etilamina (síntesis farmacéutica), anilina (fabricación de colorantes).'],
 ['Nitrogenados','amide','Amidas','Grupo –CON– muy polar; fuertes interacciones intermoleculares. Son mucho menos básicas que las aminas.','Urea (fertilizantes y cremas), poliamidas como el nailon (fibras).'],
 ['Nitrogenados','nitrile','Nitrilos','El grupo –C≡N es polar; pueden transformarse por hidrólisis en derivados de ácidos carboxílicos.','Acetonitrilo (disolvente de laboratorio), acrilonitrilo (fibras y plásticos).'],
 ['Ampliaciones','polyol','Dioles y trioles','Dos o más grupos –OH permiten formar abundantes puentes de hidrógeno; suelen aumentar viscosidad, punto de ebullición y afinidad por el agua.','Etano-1,2-diol (anticongelantes; tóxico), propano-1,2,3-triol o glicerol (humectante y cosmética).'],
 ['Ampliaciones','polyen','Dienos y polienos','Varios enlaces C=C proporcionan más posiciones reactivas. Los sistemas conjugados presentan propiedades electrónicas particulares y participan en polimerizaciones.','Buta-1,3-dieno (cauchos sintéticos), isopreno (elastómeros), carotenoides (pigmentos naturales).'],
 ['Ampliaciones','enyn','Eninos y diinos','Combinan C=C y C≡C, o varios C≡C. Son especies reactivas en síntesis y no suelen tener aplicaciones domésticas directas.','Eninos y diinos como intermediarios en síntesis orgánica y química de materiales.'],
 ['Ampliaciones','carbonyls','Carbonilos múltiples, dialdehídos y diamidas','Al aumentar los grupos C=O generalmente crecen la polaridad y las posibilidades de interacción; su reactividad depende de si son aldehídos, cetonas o amidas.','Pentano-2,4-diona (ligando en complejos), glutaraldehído (desinfección profesional), oxamida (intermedio químico).'],
 ['Ampliaciones','aminesN','Aminas secundarias y terciarias','Su basicidad y capacidad de formar puentes de hidrógeno dependen de cuántos grupos carbonados sustituyen los H del nitrógeno.','Dimetilamina (síntesis química), trietilamina (base utilizada en laboratorio e industria).'],
 ['Ampliaciones','unsatfun','Funciones con insaturaciones','Combinan el comportamiento del grupo funcional (–OH, C=O, –COOH, –CONH₂…) con reacciones del enlace múltiple C=C o C≡C.','Ácido prop-2-enoico / acrílico (polímeros acrílicos), acroleína o propenal (intermedio industrial).'],
 ['Ampliaciones','mixed','Grupos combinados y polifuncionales','Varias funciones pueden modificar mucho la polaridad, la acidez/basicidad y la reactividad; el grupo principal determina el sufijo del nombre.','Ácido láctico (alimentos y bioplásticos), hidroxiácidos (cosmética), aminoácidos (proteínas).'],
 ['Consulta','nitro','Nitrocompuestos (ampliación teórica)','El grupo –NO₂ es muy polar y modifica la reactividad del esqueleto; no debe confundirse con las aminas.','Nitrobenceno (intermedio para obtener anilina). No hay ejercicios de nitrocompuestos en el generador actual.']
];
const PRINCIPLES=[
 ['Solubilidad','Los grupos polares y los puentes de hidrógeno favorecen la solubilidad en agua, especialmente en moléculas pequeñas.','Etanol y acetona se mezclan con agua; hidrocarburos como el hexano, no.'],
 ['Longitud de cadena','Al aumentar la parte hidrocarbonada, normalmente disminuye la solubilidad acuosa y aumentan las fuerzas de dispersión y el punto de ebullición.','El metanol es miscible en agua, mientras que alcoholes de cadena larga lo son mucho menos.'],
 ['Puentes de hidrógeno','Alcoholes, ácidos y amidas con grupos N–H u O–H pueden establecer interacciones fuertes; los éteres y cetonas solo pueden aceptarlas.','El etanol hierve a mayor temperatura que el dimetiléter, pese a compartir fórmula molecular.'],
 ['Reactividad','Los enlaces múltiples suelen sufrir adiciones; los carbonilos y otros grupos funcionales tienen reacciones características.','El eteno se adiciona y polimeriza; los aldehídos pueden oxidarse a ácidos.'],
 ['Acidez','Los ácidos carboxílicos suelen ser más ácidos que los fenoles, y estos, que los alcoholes comunes.','El ácido acético reacciona con bicarbonato; el etanol no lo hace de forma comparable.'],
 ['Basicidad','Las aminas suelen ser bases; las amidas son bases mucho más débiles por deslocalización del par del nitrógeno.','La etilamina reacciona con ácidos para formar sales de amonio.']
];
function propertiesPage(){const cats=['all','Hidrocarburos','Halogenados','Oxigenados','Nitrogenados','Ampliaciones','Consulta'];
 const list=PROPERTIES.filter(p=>state.propertyCategory==='all'||p[0]===state.propertyCategory);
 const option=cats.map(k=>`<option value="${k}" ${state.propertyCategory===k?'selected':''}>${k==='all'?'Todas las familias':k==='Consulta'?'Otras familias (consulta)':k}</option>`).join('');
 return `${head('Propiedades y aplicaciones','Resumen de las propiedades generales, ejemplos cotidianos y aplicaciones industriales de las familias orgánicas, incluido el repertorio avanzado.','GUÍA DE CONSULTA · QUÍMICA ORGÁNICA')}
 <div class="card prop-intro"><h3>Cómo interpretar esta tabla</h3><p>Las propiedades indicadas son <strong>tendencias generales</strong>, no reglas absolutas para cualquier molécula. El tamaño, la estructura, las interacciones intermoleculares y los grupos funcionales presentes pueden cambiar mucho su comportamiento.</p><div class="prop-toolbar"><div class="field"><label for="propertyCategory">Mostrar categorías</label><select id="propertyCategory" data-setting="propertyCategory">${option}</select></div><span class="stat-chip">${list.length} familias o subfamilias</span></div>
 <div class="prop-table-scroll"><table class="prop-table"><thead><tr><th>Familia</th><th>Propiedades generales</th><th>Ejemplos y aplicaciones habituales</th></tr></thead><tbody>${list.map(([cat,key,title,properties,examples])=>`<tr><td class="prop-family">${esc(title)}<div class="micro muted" style="font-weight:500">${esc(cat)}</div></td><td>${esc(properties)}</td><td class="prop-use">${esc(examples)}</td></tr>`).join('')}</tbody></table></div>
 <p class="prop-note"><strong>Nota didáctica:</strong> los ejemplos se presentan para relacionar química y aplicaciones reales. Que una sustancia tenga un uso industrial no implica que sea segura para manipular en el aula. Los nitrocompuestos se incluyen solo como información, no como ejercicios del generador.</p></div>
 <div class="card"><div class="eyebrow">CLAVES PARA COMPRENDER LAS PROPIEDADES</div><h2>Seis ideas fundamentales</h2><div class="principle-grid">${PRINCIPLES.map(([title,rule,example])=>`<section class="principle"><h3>${esc(title)}</h3><p>${esc(rule)} <strong>Ejemplo:</strong> ${esc(example)}</p></section>`).join('')}</div></div>`;
}

const lessonPrevious = lessons;
lessons=function(){return lessonPrevious()+`<div class="learn-section-head learn-next"><div class="pill teal">BLOQUE 3</div><div><h2>Nomenclatura con varias funciones e insaturaciones</h2><p>Ampliación para resolver ejercicios del libro que combinan varias reglas a la vez.</p></div></div><div class="lesson-grid">
 <section class="card learn-card"><div class="eyebrow">17 · VARIOS –OH</div><h2>Dioles y trioles</h2><div class="learn-content"><p>Dos grupos hidroxilo se nombran con <strong>–diol</strong>; tres, con <strong>–triol</strong>. Indica las posiciones de todos.</p><div class="learn-example">HO–CH₂–CH₂–OH → <strong>etano-1,2-diol</strong><br>HO–CH₂–CH(OH)–CH₂–OH → <strong>propano-1,2,3-triol</strong></div><p>Un grupo –OH en el nombre no es un ion hidróxido: está unido covalentemente al carbono.</p></div></section>
 <section class="card learn-card"><div class="eyebrow">18 · MÁS DE UNA INSATURACIÓN</div><h2>Dienos, diinos y eninos</h2><div class="learn-content"><p>Si hay dos dobles enlaces se usa <strong>–dieno</strong>; dos triples, <strong>–diino</strong>. Cuando aparecen ambos tipos se indican todos sus localizadores.</p><div class="learn-example">CH₂=C=CH₂ → <strong>propa-1,2-dieno</strong><br>CH₂=CH–CH=CH₂ → <strong>buta-1,3-dieno</strong></div><p>Comprueba la tetravalencia del carbono: no todas las combinaciones de dobles y triples enlaces son posibles.</p></div></section>
 <section class="card learn-card"><div class="eyebrow">19 · FUNCIONES REPETIDAS</div><h2>Dicetonas, dialdehídos y diamidas</h2><div class="learn-content"><p>La terminación cambia según el número de funciones principales. La misma cadena puede contener varios carbonilos.</p><div class="learn-example">CH₃–CO–CH₂–CO–CH₃ → <strong>pentano-2,4-diona</strong><br>OHC–CH₂–CHO → <strong>propano-1,3-dial</strong><br>H₂N–CO–CH₂–CO–NH₂ → <strong>propanodiamida</strong></div></div></section>
 <section class="card learn-card"><div class="eyebrow">20 · FUNCIÓN PRINCIPAL Y SUFIJOS</div><h2>Prioridad y numeración</h2><div class="learn-content"><p>En un compuesto con varias funciones, identifica la <strong>función principal</strong>. Esta determina el sufijo; otras aparecen como prefijos. En estos ejercicios, por ejemplo, ácido carboxílico y amida tienen prioridad sobre alcohol.</p><div class="learn-example">CH₂=CH–COOH → <strong>ácido prop-2-enoico</strong><br>CH₃–CO–CH=CH₂ → <strong>but-3-en-2-ona</strong></div><p>Comprueba también la cadena principal: el nombre impreso en algunos ejercicios puede seguir convenciones de numeración diferentes.</p></div></section>
 <section class="card learn-card"><div class="eyebrow">21 · AMINAS SECUNDARIAS Y TERCIARIAS</div><h2>Sustituyentes unidos al nitrógeno</h2><div class="learn-content"><p>Una amina secundaria tiene dos fragmentos carbonados unidos al N; una terciaria, tres. En nomenclatura sustitutiva se usan localizadores <strong>N-</strong> y <strong>N,N-</strong>.</p><div class="learn-example">CH₃–NH–CH₃ → <strong>dimetilamina</strong><br>N(CH₃)₃ → <strong>trimetilamina</strong></div><p>No confundas la amina (N sin carbonilo) con la amida (–CONH₂).</p></div></section>
 <section class="card learn-card"><div class="eyebrow">22 · MÉTODO PARA RETOS COMBINADOS</div><h2>Descompón antes de nombrar</h2><div class="learn-content"><ol><li>Detecta grupos funcionales y su prioridad.</li><li>Selecciona la cadena principal adecuada.</li><li>Numera según la función principal y las reglas de insaturaciones.</li><li>Cuenta dobles/triples enlaces y funciones repetidas.</li><li>Ordena ramificaciones y construye el nombre.</li></ol><p>Practica estos pasos con los ejemplos en <strong>Biblioteca</strong>.</p></div></section>
 </div><div class="card learn-summary"><div><h3>Practica los compuestos del libro</h3><p>También puedes elegir las familias nuevas dentro de Nombrar y Formular, con niveles intermedio y avanzado.</p></div>${button('Abrir biblioteca →','to-library','primary')}</div>`;};
