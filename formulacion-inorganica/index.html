const safeNameAliases={

 'H4SiO4':['ácido silícico'],
 'HIO4':['ácido metaperiódico'],

 'H4P2O7':['ácido pirofosfórico'],
 'H2S2O7':['ácido pirosulfúrico']
};
for(const c of compounds){
 const extras=safeNameAliases[c.formula]||[];
 for(const text of extras)if(!c.names.some(n=>normName(n.text)===normName(text)))
   c.names.push(nm(text,'Tradicional (variante)', 'Forma equivalente de uso documentado; consulta los matices de nomenclatura.'));
 // En nombres con nº de oxidación fijo resulta posible, aunque redundante,
 // indicarlo si el metal tiene un único estado habitual en el repertorio.
 if(['Óxidos metálicos','Hidruros metálicos','Hidróxidos','Sales binarias','Oxosales neutras','Oxosales ácidas'].includes(c.family)){
   const metal=Object.keys(metals).find(k=>c.formula.startsWith(k)&&metals[k].charges.length===1);
   if(metal){let n=metals[metal].charges[0];
     for(const item of [...c.names]){
       const suffix=' de '+metals[metal].name;
       if((item.kind.includes('Stock')||item.kind.includes('Composición'))&&item.text.endsWith(suffix)){
         const alias=item.text+'('+ROMAN[n]+')';
         if(!c.names.some(v=>normName(v.text)===normName(alias)))c.names.push(nm(alias,'Stock (número opcional)','Indicador redundante para un estado de oxidación fijo.'));
       }
     }
   }
 }
}

 ],steps:['Escribe la carga positiva del metal.','Asigna −1 al hidrógeno.','Coloca tantos H como se necesiten para compensar.'],example:'CaH2',examplename:'Hidruro de calcio · dihidruro de calcio',warning:'No uses H +1 aquí: en un hidruro metálico H se considera −1.',quiz:['¿Qué fórmula corresponde al hidruro de aluminio?',['AlH','AlH₂','AlH₃','Al₃H'],2,'Al suele presentar +3 en este compuesto, y tres H⁻ compensan +3.']},
 {chapter:'Binarios',title:'11 · Hidruros no metálicos',lead:'Algunos no metales producen hidruros covalentes con nombres de sustitución propios.',body:[
 'NH₃ puede denominarse <strong>trihidruro de nitrógeno</strong> o <strong>azano</strong>; también es conocido como <strong>amoníaco</strong>.',
 'PH₃ es trihidruro de fósforo o fosfano (nombre habitual anterior: fosfina). CH₄ es tetrahidruro de carbono o metano.',
 'Estos nombres no siempre se explican mediante un simple cruce de valencias: aprender los hidruros progenitores es importante.'
 ],steps:['Reconoce el hidruro molecular.','Cuenta los átomos de hidrógeno para usar prefijos.','Relaciona el compuesto con su nombre de sustitución o nombre aceptado.'],example:'NH3',examplename:'Amoníaco · azano · trihidruro de nitrógeno',warning:'Los nombres de sustitución no están disponibles para cualquier combinación imaginaria.',quiz:['¿Qué nombre corresponde a PH₃?',['Silano','Metano','Fosfano','Azano'],2,'PH₃ es fosfano, también llamado fosfina.']},
 {chapter:'Binarios',title:'12 · Hidrácidos y disoluciones acuosas',lead:'Un nombre ácido describe la sustancia en agua, y no necesariamente el compuesto gaseoso puro.',body:[
 'HCl puro se denomina <strong>cloruro de hidrógeno</strong>. Cuando se encuentra en disolución acuosa, HCl(ac), se denomina <strong>ácido clorhídrico</strong>.',
 'El mismo criterio se aplica a HBr y HBr(ac), o H₂S y H₂S(ac). La indicación (ac) describe el medio acuoso.',
 'La app distingue deliberadamente ambos casos para que la corrección sea científicamente rigurosa.'
 ],steps:['Observa si la fórmula incluye (ac).','Si es una especie pura, utiliza su nombre de composición.','Si es la disolución acuosa, reconoce el nombre de ácido correspondiente.'],example:'HCl(aq)',examplename:'Ácido clorhídrico · cloruro de hidrógeno en disolución acuosa',warning:'HCl(g) no debería llamarse sin más ácido clorhídrico.',quiz:['¿Cuál es el ácido clorhídrico?',['HCl puro','HCl(ac)','NaCl','Cl₂'],1,'La denominación ácido clorhídrico se refiere a la disolución acuosa.']},
 {chapter:'Binarios',title:'13 · Sales binarias',lead:'Una sal binaria combina un catión metálico con un anión formado por otro elemento.',body:[
 'NaCl se conoce como <strong>cloruro de sodio</strong>. FeCl₃ es <strong>cloruro de hierro(III)</strong> o <strong>tricloruro de hierro</strong>.',
 'Al formular, combina las cargas de ambos iones. Para Ca²⁺ y N³⁻ se necesitan tres cationes calcio y dos aniones nitruro: Ca₃N₂.',
 'El nombre del anión suele terminar en -uro: fluoruro, cloruro, bromuro, yoduro, sulfuro, nitruro, fosfuro.'
 ],steps:['Identifica el anión terminado en -uro.','Obtén las cargas del metal y del no metal.','Busca la proporción neutra más simple.'],example:'FeCl3',examplename:'Cloruro de hierro(III) · tricloruro de hierro · cloruro férrico',warning:'El cloruro de hierro(II) es FeCl₂, no FeCl₃.',quiz:['¿Qué fórmula corresponde al sulfuro de aluminio?',['AlS','Al₂S₃','Al₃S₂','AlS₂'],1,'Al³⁺ y S²⁻ exigen 2 Al y 3 S.']},
 {chapter:'Binarios',title:'14 · Binarios entre no metales',lead:'En algunos compuestos moleculares de dos no metales, los prefijos expresan directamente la composición.',body:[
 'PCl₃ es <strong>tricloruro de fósforo</strong>; PCl₅, <strong>pentacloruro de fósforo</strong>. Son dos compuestos diferentes.',
 'SF₆ es hexafluoruro de azufre. También se emplean denominaciones con número de oxidación, cuando resultan adecuadas.',
 'En el generador se incluyen solo ejemplos seleccionados y conocidos, no combinaciones arbitrarias entre cualquier par de no metales.'
 ],steps:['Reconoce el elemento que aparece al final de la fórmula.','Cuenta sus átomos y aplica el prefijo correspondiente.','Completa el nombre del otro elemento.'],example:'SF6',examplename:'Hexafluoruro de azufre',warning:'No se pueden deducir todas las fórmulas covalentes mediante el simple cruce de números de oxidación.',quiz:['¿Qué es PCl₅?',['Tricloruro de fósforo','Pentacloruro de fósforo','Cloruro de fósforo(I)','Cloruro de potasio'],1,'Hay cinco átomos de cloro: penta-.']}
];
/* Lecciones nuevas: se añaden al itinerario anterior, que permanece intacto. */
lessons.push(
 {chapter:'Ternarios',title:'15 · Hidróxidos: el grupo OH',lead:'Un hidróxido metálico une un catión con el anión hidróxido, OH⁻, de carga −1.',body:[
  'El ion <strong>hidróxido OH⁻</strong> tiene dos elementos, pero actúa como <strong>un solo grupo</strong>. El sodio forma NaOH y el calcio forma Ca(OH)₂.',
  'Los paréntesis son necesarios cuando aparecen varios grupos OH: Al(OH)₃ significa tres oxígenos y tres hidrógenos. AlOH₃ no representa la misma composición.',
  'Se admiten nombres como <strong>hidróxido de hierro(III)</strong>, <strong>trihidróxido de hierro</strong> e <strong>hidróxido férrico</strong> (este último tradicional e históricamente utilizado).'
 ],steps:['Busca la carga del catión metálico.','Usa un ion OH⁻ por cada unidad de carga positiva.','Si necesitas varios OH, escríbelos entre paréntesis.'],example:'Cu(OH)2',examplename:'Hidróxido de cobre(II) · dihidróxido de cobre',warning:'No confundas CuOH (cobre(I)) y Cu(OH)₂ (cobre(II)).',quiz:['¿Por qué se escribe Ca(OH)₂ con paréntesis?',['Porque el calcio tiene dos protones','Porque hay dos grupos OH completos','Porque el H tiene carga +2','Porque el oxígeno es diatómico'],1,'El calcio es Ca²⁺ y necesita dos iones OH⁻ completos.']},
 {chapter:'Ternarios',title:'16 · Oxoácidos: H, elemento central y O',lead:'Un oxoácido contiene hidrógeno, oxígeno y otro elemento; su nombre depende del compuesto concreto.',body:[
  'En oxoácidos sencillos, la fórmula suele escribirse como HₐXOᵦ. Por ejemplo, HNO₃ contiene hidrógeno, nitrógeno y oxígeno.',
  'Para calcular el número de oxidación del elemento central, considera H habitualmente +1 y O habitualmente −2. Así, en HNO₃: 1 + x − 6 = 0, por tanto x = +5.',
  'No se pueden construir todas las especies reales a partir de una combinación arbitraria de números de oxidación. En el laboratorio se trabajan <strong>oxoácidos conocidos</strong>. '
 ],steps:['Identifica H, O y el elemento central.','Calcula el número de oxidación cuando sea útil.','Relaciona la fórmula con un oxoácido registrado y su nombre admitido.'],example:'HNO3',examplename:'Ácido nítrico · hidrógeno(trioxidonitrato)',warning:'HNO₂ (ácido nitroso) y HNO₃ (ácido nítrico) son especies diferentes.',quiz:['¿Cuál es el número de oxidación del nitrógeno en HNO₃?',['+3','+4','+5','−3'],2,'La suma 1 + x + 3·(−2) = 0 exige x = +5.']},
 {chapter:'Ternarios',title:'17 · Serie de oxoácidos del cloro',lead:'El nombre tradicional permite diferenciar cuatro oxoácidos mediante hipo-, -oso, -ico y per-.',body:[
  '<strong>HClO</strong> es ácido hipocloroso, <strong>HClO₂</strong> es ácido cloroso, <strong>HClO₃</strong> es ácido clórico y <strong>HClO₄</strong> es ácido perclórico.',
  'El cloro tiene, respectivamente, números de oxidación +1, +3, +5 y +7. Cada incremento de dos unidades añade un oxígeno si H y Cl permanecen iguales.',
  'Esta pauta también explica las parejas de aniones: hipoclorito, clorito, clorato y perclorato. No se traslada indiscriminadamente a todos los elementos.'
 ],steps:['Identifica cuántos oxígenos aparecen.','Relaciona 1, 2, 3 o 4 oxígenos con hipo-…-oso, -oso, -ico o per-…-ico.','Verifica el número de oxidación del cloro.'],example:'HClO4',examplename:'Ácido perclórico · hidrógeno(tetraoxidoclorato)',warning:'«Ácido clórico» y «ácido perclórico» tienen fórmulas diferentes.',quiz:['¿Qué fórmula corresponde al ácido cloroso?',['HClO','HClO₂','HClO₃','HClO₄'],1,'Cloroso corresponde al segundo miembro, HClO₂.']},
 {chapter:'Ternarios',title:'18 · Oxoácidos del N, S y C',lead:'Aprende las series más frecuentes y razona el estado de oxidación.',body:[
  'Nitrógeno: <strong>HNO₂</strong> es ácido nitroso y <strong>HNO₃</strong> es ácido nítrico.',
  'Azufre: <strong>H₂SO₃</strong> es ácido sulfuroso y <strong>H₂SO₄</strong> es ácido sulfúrico. Carbono: <strong>H₂CO₃</strong> es ácido carbónico.',
  'Relaciona cada ácido con el oxoanión correspondiente: nitrito/nitrato, sulfito/sulfato y carbonato. Para neutralizar el ácido pueden sustituirse los H ácidos por cationes.'
 ],steps:['Diferencia terminaciones -oso (estado inferior) e -ico (superior) dentro de cada serie.','Comprueba el número de oxígenos.','Distingue el oxoácido de su oxoanión sin hidrógeno.'],example:'H2SO4',examplename:'Ácido sulfúrico · dihidrógeno(tetraoxidosulfato)',warning:'SO₄²⁻ es el ion sulfato; H₂SO₄ es el ácido sulfúrico.',quiz:['¿Qué ácido corresponde al sulfato, SO₄²⁻?',['H₂SO₃','H₂SO₄','HNO₃','H₂CO₃'],1,'Dos H⁺ compensan la carga −2 del sulfato.']},
 {chapter:'Ternarios',title:'19 · Oxoácidos especiales: orto, meta, di y piro',lead:'Las fórmulas de algunos oxoácidos se relacionan formalmente mediante agua, pero esa regla escolar no describe por sí sola su estructura real.',body:[
  '<strong>1. ¿Por qué son especiales?</strong> En los oxoácidos habituales suele haber H, un elemento central y O. Sus hidrógenos pueden estar unidos a O (grupos OH), pero no basta mirar los subíndices para determinar cuántos protones ácidos puede ceder.',
  '<strong>2. ¿Qué significaban orto- y meta-?</strong> Tradicionalmente distinguen composiciones relacionadas por pérdida o incorporación formal de agua: la forma <em>orto</em> presenta mayor contenido de H y O; <em>meta</em>, menor. Es un recurso para comparar fórmulas, <strong>no un procedimiento universal de síntesis</strong>.',
  '<strong>3. Fósforo(V):</strong> H₃PO₄ es <strong>ácido fosfórico</strong> (también ortofosfórico). La composición metafosfórica se expresa como <strong>(HPO₃)ₙ</strong>: la unidad HPO₃ equivale formalmente a H₃PO₄ − H₂O. El ácido fosfórico común no necesita el prefijo orto-.',
  '<strong>4. Boro(III):</strong> H₃BO₃ es <strong>ácido bórico</strong> (u ortobórico) y el metabórico se representa por la composición <strong>(HBO₂)ₙ</strong>. Los dos contienen B con número de oxidación +3. En disolución acuosa el ácido bórico se comporta principalmente como ácido de Lewis, de modo que no conviene inferir su acidez solo por los tres OH.',
  '<strong>5. Silicio(IV):</strong> H₄SiO₄ es <strong>ácido ortosilícico</strong>, y la composición metasilícica puede expresarse como <strong>(H₂SiO₃)ₙ</strong>. Estas especies pueden formar redes o cadenas; una fórmula empírica no obliga a que haya moléculas aisladas H₂SiO₃.',
  '<strong>6. Yodo(VII):</strong> HIO₄ es <strong>ácido peryódico</strong>, también llamado <em>metaperyódico</em>. H₅IO₆ es <strong>ácido ortoperyódico</strong>. Aquí el prefijo orto- <strong>sí distingue</strong> una composición concreta; no debe omitirse si queremos nombrar H₅IO₆.',
  '<strong>7. Ácidos di- y piro-:</strong> 2 H₃PO₄ − H₂O = <strong>H₄P₂O₇</strong> (ácido <strong>difosfórico</strong>, tradicionalmente pirofosfórico). Igualmente 2 H₂SO₄ − H₂O = <strong>H₂S₂O₇</strong> (ácido <strong>disulfúrico</strong>, tradicionalmente pirosulfúrico). En nomenclatura se prefiere <em>di-</em> para estos casos.',
  '<strong>8. No confundas H₃PO₄ con H₃PO₃:</strong> H₃PO₄ contiene fósforo(+5) y se representa P(O)(OH)₃. La estructura habitual de H₃PO₃ es <strong>HP(O)(OH)₂</strong>: contiene un enlace P–H y <strong>solo dos hidrógenos ácidos</strong>. En nomenclatura sistemática se denomina ácido fosfónico; en libros escolares aparece ácido fosforoso.',
  '<strong>9. Tres sistemas de nombres:</strong> para H₃PO₄: <em>ácido fosfórico</em> (tradicional conservado), <em>trihidrógeno(tetraoxidofosfato)</em> (hidrógeno) y <em>trihidroxidooxidofósforo</em> (adición). La nomenclatura de hidrógeno no presupone una determinada conectividad; la de adición puede expresarla.',
  '<strong>10. Nombres que NO conviene generar mecánicamente:</strong> las formas antiguas «ácido tetraoxofosfórico(V)» o «ácido tetraoxosulfúrico(VI)» pueden encontrarse en materiales docentes, pero no sustituyen los sistemas actuales de nomenclatura de hidrógeno y adición. Tampoco todo prefijo piro- se obtiene simplemente anteponiéndolo a cualquier ácido.'
 ],steps:['Identifica el elemento central y calcula su estado de oxidación con H +1 y O −2 cuando proceda.','Compara la fórmula concreta con otras de la misma familia; no deduzcas propiedades estructurales solo del balance formal de agua.','Distingue las composiciones orto y meta, sin olvidar los casos poliméricos.','En condensaciones, suma primero los ácidos y resta H₂O equilibrando todos los átomos.','Para nombrar, usa el nombre tradicional conservado o uno sistemático registrado y comprueba si el prefijo realmente distingue la sustancia.'],example:'H4P2O7',examplename:'Ácido difosfórico · nombre tradicional: pirofosfórico',warning:'Los oxoácidos contienen oxígeno, hidrógeno y otro elemento: son ternarios, no binarios. Los prefijos orto-/meta- no sirven como una receta universal, y H₃PO₃ solo tiene dos protones ácidos.',quiz:['¿Qué afirmación es químicamente correcta?',['H₃PO₃ libera necesariamente tres H⁺ porque tiene tres H','H₅IO₆ es ácido ortoperyódico y no tiene la misma fórmula que HIO₄','Todas las fórmulas meta son moléculas monoméricas estables','Piro- es el prefijo sistemático preferente para todos los ácidos condensados'],1,'HIO₄ y H₅IO₆ contienen yodo(+7) pero distintas composiciones; el prefijo orto- distingue H₅IO₆.']},
 {chapter:'Ternarios',title:'20 · Oxosales neutras: del anión a la sal',lead:'Una oxosal neutra se obtiene al combinar un catión con un oxoanión sin hidrógeno ácido.',body:[
  'NaNO₃ es <strong>nitrato de sodio</strong> y CaCO₃ es <strong>carbonato de calcio</strong>. Ambos se forman compensando las cargas de sus iones.',
  'Los aniones poliatómicos conservan la unidad: NO₃⁻, SO₄²⁻, CO₃²⁻ y PO₄³⁻. La sal debe tener carga total cero.',
  'Además de nitrato de calcio, Ca(NO₃)₂ puede llamarse bis(trioxidonitrato) de calcio. La nomenclatura de adición puede indicar la carga del oxoanión.'
 ],steps:['Reconoce el oxoanión y su carga.','Determina la carga del catión.','Busca cuántas unidades de cada ion compensan la carga total.'],example:'Ca(NO3)2',examplename:'Nitrato de calcio · bis(trioxidonitrato) de calcio',warning:'Las oxosales ácidas con cuatro elementos se abordarán en Cuaternarios.',quiz:['¿Qué fórmula corresponde al carbonato de sodio?',['NaCO₃','Na₂CO₃','Na(CO₃)₂','Na₃CO₃'],1,'CO₃²⁻ necesita dos Na⁺.']},
 {chapter:'Ternarios',title:'21 · Oxosales: paréntesis y prefijos multiplicadores',lead:'Los paréntesis de las oxosales representan repeticiones de un ion entero.',body:[
  'Fe₂(SO₄)₃ contiene <strong>dos</strong> cationes Fe³⁺ y <strong>tres</strong> aniones SO₄²⁻. Carga total: 2·(+3) + 3·(−2) = 0.',
  'Para una unidad del anión basta escribirlo sin paréntesis: CaSO₄. Cuando hay más de una, usamos, por ejemplo, Ca(NO₃)₂.',
  'La nomenclatura de composición utiliza <strong>bis(…)</strong>, <strong>tris(…)</strong> y <strong>tetrakis(…)</strong> para grupos complejos repetidos.'
 ],steps:['Calcula la proporción catión:anión.','Agrupa con paréntesis el anión poliatómico solo cuando se repite.','Comprueba la suma de cargas y la nomenclatura propuesta.'],example:'Fe2(SO4)3',examplename:'Sulfato de hierro(III) · tris(tetraoxidosulfato) de dihierro',warning:'FeSO₄ corresponde al hierro(II), no al hierro(III).',quiz:['¿Cuántos átomos de oxígeno tiene Fe₂(SO₄)₃?',['3','4','7','12'],3,'Hay tres grupos SO₄: 3 × 4 = 12 oxígenos.']},
 {chapter:'Ternarios',title:'22 · Tres modos actuales de nombrar oxoácidos',lead:'Tradicional, adición e hidrógeno pueden describir el mismo oxoácido de formas distintas.',body:[
  'Para H₂SO₄ se admite <strong>ácido sulfúrico</strong> (tradicional), <strong>dihidroxidodioxidoazufre</strong> (adición) y <strong>dihidrógeno(tetraoxidosulfato)</strong> (nomenclatura de hidrógeno).',
  'La nomenclatura de <strong>adición</strong> describe los grupos unidos al átomo central cuando la estructura lo permite. La de <strong>hidrógeno</strong> indica el número de H y nombra la parte aniónica.',
  'En materiales antiguos encontrarás expresiones como «ácido tetraoxosulfúrico(VI)». La aplicación puede reconocer ciertas formas históricas, pero las señalará como desaconsejadas.'
 ],steps:['Identifica la familia y la fórmula antes de escoger el sistema de nombres.','Si se usa adición, cuenta los grupos OH y los oxígenos enlazados al elemento central.','Si se usa nomenclatura de hidrógeno, indica H y el oxoanión entre paréntesis.'],example:'H2CO3',examplename:'Ácido carbónico · dihidrógeno(trioxidocarbonato)',warning:'No se extrapolan por algoritmo nombres de adición a estructuras desconocidas.',quiz:['¿Qué nombre describe H₂SO₄ por nomenclatura de hidrógeno?',['Hidrógeno(trioxidosulfato)','Dihidrógeno(tetraoxidosulfato)','Dihidrógeno(trioxidocarbonato)','Hidrógeno(dioxidonitrato)'],1,'Tiene dos hidrógenos y cuatro oxígenos alrededor del azufre.']},
 {chapter:'Ternarios',title:'23 · Sales ácidas de hidrácidos',lead:'Existen sales ternarias con hidrógeno que no son oxosales ácidas.',body:[
  'NaHS contiene <strong>Na, H y S</strong>: es una sal ácida de un hidrácido y se nombra <strong>hidrogenosulfuro de sodio</strong>.',
  'En Ca(HS)₂, los dos grupos HS⁻ neutralizan el Ca²⁺. El anión hidrogenosulfuro no contiene oxígeno.',
  'No debe confundirse esta familia de <strong>tres elementos</strong> con las oxosales ácidas como NaHCO₃, de <strong>cuatro elementos</strong>, que se trabajan en Cuaternarios.'
 ],steps:['Comprueba que la fórmula tenga un metal, hidrógeno y un no metal sin oxígeno.','Reconoce el anión HS⁻ u otro anión ácido correspondiente.','Compensa su carga con la del catión.'],example:'NaHS',examplename:'Hidrogenosulfuro de sodio',warning:'NaHS y NaHCO₃ no pertenecen a la misma categoría de número de elementos.',quiz:['¿Por qué NaHS es ternario?',['Porque tiene tres átomos en total','Porque contiene tres elementos distintos','Porque contiene oxígeno','Porque contiene tres grupos OH'],1,'Contiene Na, H y S: tres elementos diferentes.']}
);

lessons.push(
 {chapter:'Cuaternarios',title:'24 · ¿Qué es un compuesto cuaternario?',lead:'Cuaternario significa que la fórmula contiene cuatro elementos distintos, no cuatro átomos.',body:[
  'Observa <strong>NaHCO₃</strong>: aparecen Na, H, C y O. En cambio, Ca(OH)₂ solo contiene Ca, O y H: es ternario.',
  'En este apartado estudiaremos <strong>oxosales ácidas</strong>, <strong>sales básicas</strong> y <strong>sales dobles</strong> de cuatro elementos. Los iones siguen teniendo su propia categoría.',
  'El número de elementos es distinto del número total de átomos. KAl(SO₄)₂ contiene cuatro elementos, pero doce átomos en cada unidad fórmula.'
 ],steps:['Descompón correctamente cada símbolo químico.','Cuenta elementos distintos, no átomos.','Reconoce si hay hidrógeno ácido, OH⁻ o dos cationes diferentes.'],example:'NaHCO3',examplename:'Hidrogenocarbonato de sodio',warning:'Al añadir agua de cristalización a una sal anhidra pueden aparecer elementos adicionales.',quiz:['¿Cuántos elementos distintos hay en NaHCO₃?',['3','4','5','6'],1,'Na, H, C y O son cuatro elementos.']},
 {chapter:'Cuaternarios',title:'25 · Oxosales ácidas: conservar hidrógeno',lead:'Una oxosal ácida conserva uno o varios H del oxoácido cuando este no se neutraliza completamente.',body:[
  'El ácido sulfúrico <strong>H₂SO₄</strong> puede perder un H⁺ y originar <strong>HSO₄⁻</strong>. Si ese anión se combina con Na⁺, obtenemos <strong>NaHSO₄</strong>.',
  'El ácido carbónico H₂CO₃ origina HCO₃⁻, cuyo nombre recomendado es <strong>hidrogenocarbonato</strong>. La palabra «bicarbonato» es muy frecuente, pero no es el sistema preferente.',
  'El ácido fosfórico H₃PO₄ forma dos aniones ácidos habituales: <strong>H₂PO₄⁻</strong> y <strong>HPO₄²⁻</strong>; no tienen la misma carga.'
 ],steps:['Parte del oxoácido y determina los H que permanecen en el anión.','Identifica la carga del oxoanión ácido.','Equilibra esa carga con el catión y coloca paréntesis si necesitas varios oxoaniones.'],example:'Ca(HSO4)2',examplename:'Hidrogenosulfato de calcio',warning:'Na₂SO₄ es una oxosal neutra ternaria; NaHSO₄ es una oxosal ácida cuaternaria.',quiz:['¿Qué anión contiene el hidrogenosulfato de calcio?',['SO₄²⁻','HSO₄⁻','H₂SO₄','OH⁻'],1,'El hidrogenosulfato es HSO₄⁻, de carga −1.']},
 {chapter:'Cuaternarios',title:'26 · Oxosales ácidas: fórmulas y paréntesis',lead:'El anión ácido completo se mantiene unido cuando hace falta más de una unidad.',body:[
  'En el hidrogenosulfato de hierro(III), Fe³⁺ se combina con tres HSO₄⁻. La fórmula es <strong>Fe(HSO₄)₃</strong>.',
  'En los fosfatos ácidos, <strong>H₂PO₄⁻</strong> y <strong>HPO₄²⁻</strong> requieren cantidades diferentes del mismo catión. Por ejemplo, KH₂PO₄ y K₂HPO₄.',
  'Cuando un oxoanión se repite, los paréntesis abarcan el grupo <strong>entero</strong>, incluidos los H conservados.'

const htmlEscape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normName(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[−–—]/g,'-').replace(/\s+/g,' ').replace(/\s*\(\s*/g,'(').replace(/\s*\)\s*/g,')').replace(/\s*,\s*/g,',').trim()}
function normFormula(s){
 let str=String(s).trim().replace(/[\s\u00a0]/g,'').replace(/₀/g,'0').replace(/₁/g,'1').replace(/₂/g,'2').replace(/₃/g,'3').replace(/₄/g,'4').replace(/₅/g,'5').replace(/₆/g,'6').replace(/₇/g,'7').replace(/₈/g,'8').replace(/₉/g,'9');
 str=str.replace(/\((ac|aq)\)$/i,'(aq)').replace(/−/g,'-');
 const smap={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
 str=str.replace(/([⁰¹²³⁴⁵⁶⁷⁸⁹]*)([⁺⁻])$/,(_,digits,sign)=>(digits?'^'+Array.from(digits).map(x=>smap[x]).join(''):'')+(sign==='⁺'?'+':'-'));
 str=str.replace(/^([A-Z][a-z]?)(\d+)([+-])$/,(_,el,charge,sign)=>el+'^'+charge+sign);
 str=str.replace(/\^1([+-])$/,'$1');
 return str;
}
function chemHTML(formula){
 const clean=String(formula),aq=clean.endsWith('(aq)'),base=aq?clean.slice(0,-4):clean;
 const m=base.match(/\^(\d+)([+-])$|([+-])$/);
 let atom=base,charge='';
 if(m){atom=base.slice(0,m.index);charge=(m[1]||'')+(m[2]||m[3]);}
 const atoms=htmlEscape(atom).replace(/(\d+)/g,'<sub>$1</sub>');
 return atoms+(charge?'<sup>'+htmlEscape(charge.replace('-','−'))+'</sup>':'')+(aq?'<span class="aq">(ac)</span>':'');
}

function promptName(c){const names=c.names.filter(n=>state.promptScheme==='Todas'||n.kind.toLowerCase().includes(state.promptScheme.toLowerCase()));return choose(names.length?names:c.names)}
function newExercise(){
 let list=available();if(!list.length){state.exercise=null;return}
 const alternatives=list.filter(x=>!state.recent.includes(x.id));
 const chosen=choose(alternatives.length?alternatives:list);
 state.recent.push(chosen.id);if(state.recent.length>Math.min(18,Math.ceil(list.length/2)))state.recent.shift();
 state.exercise={id:chosen.id,prompt:promptName(chosen)};
 state.entered='';state.answerState=null;state.locked=false;state.hints=0;
}

function hintText(c,step,isName){
 if(step===0)return `Familia: ${c.family}. Nivel: ${familyLevel(c)}.`;
 if(c.category==='Cuaternarios'&&step===1){
  if(c.family==='Oxosales ácidas')return 'Busca el anión que todavía conserva H: HSO₄⁻, HCO₃⁻, H₂PO₄⁻ o HPO₄²⁻. Equilibra las cargas.';
  if(c.family==='Sales básicas')return 'Contiene OH⁻ y otro anión: comprueba la proporción de cationes y de ambos aniones.';
  return 'Hay dos cationes distintos. Suma sus cargas y neutralízalas con los iones sulfato SO₄²⁻.';
 }
 if(c.category==='Cuaternarios'&&step===2)return isName?'Comprueba si el nombre debe especificar hidrógeno, dos aniones o dos cationes.':'Los grupos poliatómicos repetidos necesitan paréntesis y el balance total debe ser cero.';
 if(c.category==='Ternarios'&&step===1){
  if(c.family==='Hidróxidos')return 'El grupo OH⁻ lleva carga −1 y se mantiene unido en la fórmula.';
  if(c.family==='Oxosales neutras')return 'Identifica el oxoanión (por ejemplo SO₄²⁻) y equilibra su carga con el catión.';
  if(c.family==='Oxoácidos')return 'Calcula el número de oxidación del elemento central: H suele ser +1 y O suele ser −2.';
  return 'Busca el anión ácido con hidrógeno, sin oxígeno, y equilibra las cargas.';
 }
 if(c.category==='Ternarios'&&step===2)return isName?'Revisa la terminación tradicional o los prefijos y cargas admitidos.':'Comprueba que los paréntesis abarcan grupos enteros cuando se repiten.';
 if(step===1){if(isName)return c.category==='Iones'?'Identifica primero si la carga es positiva o negativa y comprueba si el ion es monoatómico o poliatómico.':'Cuenta los átomos y localiza el número de oxidación cuando sea necesario.';
 return c.category==='Iones'?'Recuerda que la carga se escribe como superíndice; con magnitud superior a uno puedes escribir ^2+ o ^3-.':'Construye una fórmula que respete la neutralidad eléctrica y los subíndices.'}
 return isName?'Puede tener varios nombres correctos. Prueba con la nomenclatura de composición, el número de oxidación o el nombre tradicional si existe.':'Revisa si hay que simplificar una proporción o mantener intacto un grupo característico como O₂²⁻.';
}
/* Diagnóstico conservador: solo indica una causa cuando los datos la permiten.
   No modifica los nombres admitidos ni inventa un nombre químico. */
function formulaTokens(raw){
 const s=normFormula(raw).replace(/\(aq\)$/i,'').replace(/\^(?:\d+)?[+-]$/,'').replace(/[+-]$/,'');
 let i=0;const valid=/^[A-Z][a-z]?$/;
 function parse(stop){const counts={};while(i<s.length){if(s[i]===')'){if(stop){i++;return counts}return null}
 let sub;
 if(s[i]==='('){i++;sub=parse(true);if(!sub)return null}
 else{const m=s.slice(i).match(/^[A-Z][a-z]?/);if(!m||!valid.test(m[0]))return null;sub={[m[0]]:1};i+=m[0].length}
 const m=s.slice(i).match(/^\d+/);const k=m?+m[0]:1;if(m)i+=m[0].length;if(!k||k>10000)return null;
 for(const [x,n] of Object.entries(sub))counts[x]=(counts[x]||0)+n*k;
 }return stop?null:counts}
 return parse(false);
}
function formulaDiagnostic(c,input){
 const target=normFormula(c.formula),got=normFormula(input);
 if(!got)return ['Fórmula vacía','Escribe una fórmula para comprobarla.'];
 if((target.endsWith('(aq)')!==got.endsWith('(aq)'))&&target.replace(/\(aq\)$/,'')===got.replace(/\(aq\)$/,''))
   return ['Estado de la sustancia','La indicación (ac) distingue la disolución acuosa del compuesto puro; revisa el estado pedido.'];
 const targetCharge=(target.match(/\^(\d+)?([+-])$/)||target.match(/([+-])$/)||[]).slice(-2).join('');
 const gotCharge=(got.match(/\^(\d+)?([+-])$/)||got.match(/([+-])$/)||[]).slice(-2).join('');
 if(targetCharge!==gotCharge)return ['Carga del ion','Comprueba magnitud y signo de la carga; no confundas el superíndice con los subíndices.'];
 const want=formulaTokens(target),have=formulaTokens(got);
 if(!have)return ['Sintaxis química','Revisa símbolos (primera letra mayúscula), paréntesis y números escritos detrás de los símbolos.'];
 if(!want)return ['Fórmula','Revisa que la fórmula introducida corresponda a la especie del enunciado.'];
 const differ=Object.keys({...want,...have}).filter(k=>want[k]!==have[k]);
 if(differ.length){const absent=differ.filter(k=>!(k in want));const missing=differ.filter(k=>!(k in have));
  if(absent.length||missing.length)return ['Elementos distintos',`Comprueba los símbolos químicos. ${missing.length?'Faltan: '+missing.join(', ')+'. ':''}${absent.length?'Sobran: '+absent.join(', ')+'.':''}`];
  return ['Subíndices y proporciones','Los elementos son los adecuados, pero las cantidades de '+differ.join(', ')+' no coinciden. Comprueba el balance de cargas.'];
 }
 return ['Agrupación y escritura','El recuento de elementos coincide. Comprueba los paréntesis, la estructura y el orden convencional de la fórmula, y el estado físico si procede.'];
}
function diagnoseAnswer(c,input,isName){
 if(!isName)return formulaDiagnostic(c,input);
 const key=normName(input);const other=compounds.find(x=>x.id!==c.id&&x.names.some(n=>normName(n.text)===key));
 if(other)return ['Compuesto diferente',`Ese nombre está registrado para ${other.formula} (${other.family}), no para ${c.formula}. Comprueba la fórmula del enunciado.`];
 if(/\([ivx]+\)/i.test(input)||/\([1-4]\+\)/.test(input))return ['Estado de oxidación','Revisa el número romano o el número de carga y comprueba que corresponda al elemento y a la especie pedidos.'];
 if(/\b(hipo|per|meta|orto|piro)/i.test(input))return ['Prefijo especial','Revisa si el prefijo corresponde al oxoácido concreto. Meta, orto y di no son intercambiables.'];
 return ['Nombre no reconocido','Esa denominación no figura entre las variantes aceptadas de esta especie. Revisa composición, cargas y terminaciones; también puedes consultar Explorar.'];
}
function weakestFamily(){
 return Object.entries(progress.byFamily).filter(([name,v])=>v.wrong>0)
 .map(([family,v])=>({family,wrong:v.wrong,tries:v.correct+v.wrong,category:compounds.find(c=>c.family===family)?.category}))
 .filter(x=>x.category).sort((a,b)=>b.wrong/(b.tries||1)-a.wrong/(a.tries||1)||b.wrong-a.wrong)[0];
}

function updateStats(c,status,reason){
 const family=c.family;
 if(!progress.byFamily[family])progress.byFamily[family]={correct:0,wrong:0,skipped:0};
 progress[status]++;progress.byFamily[family][status]++;if(status==='wrong'&&reason){progress.errors[reason]=(progress.errors[reason]||0)+1;}
 progress.history.unshift({formula:c.formula,kind:state.section,status,family,reason:reason||'',date:new Date().toISOString()});progress.history=progress.history.slice(0,30);persist();
}
function checkAnswer(){if(state.locked||!state.exercise)return;const c=compounds.find(x=>x.id===state.exercise.id),answer=document.getElementById('answer')?.value||'';state.entered=answer;
 if(!answer.trim()){state.answerState={type:'error'};renderMain();return}
 let match;
 if(state.section==='name')match=c.names.find(n=>normName(n.text)===normName(answer));
 else match=[c.formula,...(formulaAliases[c.formula]||[])].some(form=>normFormula(answer)===normFormula(form))?{kind:'Fórmula correcta'}:null;
 if(match){updateStats(c,'correct');state.locked=true;state.answerState={type:'correct',matched:state.section==='name'?match.kind:''}}
 else{const [reason,message]=diagnoseAnswer(c,answer,state.section==='name');updateStats(c,'wrong',reason);state.answerState={type:'error',reason,message}}
 renderMain();if(!state.locked)document.getElementById('answer')?.focus();
}

function parseIonicCode(s){const m=s.match(/^([A-Z][a-z]?)([1-4])$/);return m?{el:m[1],q:+m[2]}:null}
function buildNeutralFormula(m,anion,q){const d=gcd(m.q,-q),na=m.q/d,nm=-q/d;return m.el+(nm>1?nm:'')+(na>1&&anion.length>1?'('+anion+')'+na:anion+(na>1?na:''));}

function renderBuilder(){const list=constructorAnions[state.category];if(!list)return `<div class="empty">Los iones se consultan individualmente en la biblioteca. Selecciona Binarios, Ternarios o Cuaternarios para combinar un catión con un anión.</div>`;
 if(!list.some(x=>x[0]===state.builderAnion))state.builderAnion=list[0][0];
 const allMetals=Object.entries(metals).flatMap(([sym,m])=>m.charges.map(q=>({value:sym+q,label:m.name+' ('+q+'+)',el:sym,q})));
 if(!allMetals.some(x=>x.value===state.builderMetal))state.builderMetal='Na1';
 const c=possibleConstructor();if(!c)return '';
 return `<section class="reference-subpanel"><h3>Constructor de fórmulas por neutralidad</h3><p class="aside-note">Selecciona dos iones para calcular la proporción de cargas. Solo se propone como ejercicio una especie incluida y revisada en la biblioteca.</p><div class="control-row"><div class="field"><label>Catión metálico</label><select data-setting="builderMetal">${allMetals.map(x=>`<option value="${x.value}" ${x.value===state.builderMetal?'selected':''}>${htmlEscape(x.label)}</option>`).join('')}</select></div><div class="field"><label>Anión</label><select data-setting="builderAnion">${list.map(x=>`<option value="${x[0]}" ${x[0]===state.builderAnion?'selected':''}>${htmlEscape(x[1])} (${x[2]}−)</option>`).join('')}</select></div></div><div class="build-result"><div class="tiny">Proporción eléctricamente neutra</div>${f(c.expected,'sm')}<p>${htmlEscape(c.m.el)}: +${c.m.q} · ${htmlEscape(c.a[1])}: ${c.a[2]} · suma de cargas = 0</p>${c.found?`<span class="pill mint">Incluido en la biblioteca</span><div class="actions" style="margin-top:12px"><button class="btn primary small" data-action="open-built" data-value="${c.found.id}">Ver denominaciones</button><button class="btn secondary small" data-action="practice-detail" data-value="formula:${c.found.id}">Practicar fórmula</button></div>`:`<div class="tip">Esta combinación no forma parte de las especies validadas para esta versión. Que las cargas cuadren <strong>no garantiza</strong> que exista una sustancia aislable con esta fórmula.</div>`}</div></section>`;

 <div class="stepbox"><div class="section-title">Precisión global</div><div class="progressbar"><span style="width:${pct}%"></span></div><div class="tiny">${total} comprobaciones realizadas; ${progress.skipped} ejercicios saltados.</div></div>
 <div style="margin-top:22px"><h3 class="section-title">Progreso por familia</h3>${famEntries.length?famEntries.map(([name,v])=>{let t=v.correct+v.wrong,p=t?Math.round(v.correct/t*100):0;return `<div class="barrow"><div>${htmlEscape(name)}</div><div class="progressbar"><span style="width:${p}%"></span></div><div class="tiny" style="text-align:right">${p}%</div></div>`}).join(''):'<div class="empty">Todavía no hay ejercicios resueltos. Empieza en Nombrar o Formular.</div>'}</div>
 <div class="line"></div><h3 class="section-title">¿Qué conceptos necesitas reforzar?</h3>
 ${Object.keys(progress.errors).length?Object.entries(progress.errors).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([reason,n])=>`<div class="barrow"><div>${htmlEscape(reason)}</div><div class="progressbar"><span style="width:${Math.round(100*n/Math.max(1,progress.wrong))}%"></span></div><div class="tiny" style="text-align:right">${n}</div></div>`).join(''):'<div class="empty">Cuando revises errores aparecerán aquí agrupados por tipo.</div>'}
 ${weakestFamily()?`<div class="tip blue"><span>🎯</span><span>Familia que conviene reforzar: <strong>${htmlEscape(weakestFamily().family)}</strong><div style="margin-top:10px"><button class="btn small primary" data-action="practice-hard">Practicar esta familia</button></div></span></div>`:''}
 <div class="line"></div><h3 class="section-title">Lecciones superadas</h3><div class="stats-grid" style="grid-template-columns:1fr 1fr"><div class="stat"><strong>${progress.completedLessons.length}/${lessons.length}</strong><small>Mini retos correctos</small></div><div class="stat"><strong>${Math.round(100*progress.completedLessons.length/lessons.length)}%</strong><small>Itinerario completo</small></div></div>
 <div class="line"></div><h3 class="section-title">Actividad reciente</h3>${progress.history.length?`<div class="stack">${progress.history.slice(0,10).map(h=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #e9eef4;padding:8px 0"><span>${f(h.formula,'xs')} <span class="tiny">· ${htmlEscape(h.family)} ${h.reason?'· '+htmlEscape(h.reason):''}</span></span><span class="pill ${h.status==='correct'?'mint':h.status==='wrong'?'amber':'gray'}">${h.status==='correct'?'Correcta':h.status==='wrong'?'Revisar':'Saltada'}</span></div>`).join('')}</div>`:'<div class="empty">Aún no hay historial.</div>'}
 <div class="actions" style="margin-top:23px"><button class="btn danger" data-action="reset-progress">Borrar progreso local</button></div></section>`;
}
function setCategory(cat){if(!categories.some(c=>c[0]===cat))return;state.category=cat;state.family='Todas';state.search='';state.showLimit=16;state.detailId=null;state.exercise=null;state.elementFilter='';state.quizAnswers={};
 const lessonsThere=getRelevantLessons();if(cat==='Iones')state.lesson=4;else if(cat==='Binarios')state.lesson=6;else if(cat==='Ternarios')state.lesson=14;else if(cat==='Cuaternarios')state.lesson=23;else state.lesson=0;
 if(state.section==='progress'){}render();
}
function setModule(section){state.section=section;state.family='Todas';state.exercise=null;state.search='';state.detailId=null;state.showLimit=16;state.elementFilter='';
 if(section==='learn')chooseLessonCategory();render();
}
function doInsert(value){const input=document.getElementById('answer');if(!input||state.locked)return;
 const start=input.selectionStart??input.value.length,end=input.selectionEnd??input.value.length;
 input.value=input.value.slice(0,start)+value+input.value.slice(end);state.entered=input.value;input.focus();input.setSelectionRange(start+value.length,start+value.length)}
function detailPractice(val){const [module,id]=val.split(':');if(!['name','formula'].includes(module))return;
 const c=compounds.find(c=>c.id===id);if(!c)return;state.section=module;state.category=c.category;state.family=c.family;state.level='Todos';state.promptScheme='Todas';state.exercise={id:c.id,prompt:promptName(c)};state.entered='';state.locked=false;state.answerState=null;state.hints=0;render();}
document.addEventListener('click',event=>{
 const btn=event.target.closest('[data-action]');if(!btn)return;
 const act=btn.dataset.action,value=btn.dataset.value;
 if(act==='module')setModule(value);
 else if(act==='category')setCategory(value);
 else if(act==='family'){state.family=value;state.detailId=null;state.showLimit=16;state.exercise=null;render();}
 else if(act==='special'){state.specialCase=Number(value);renderMain()}
 else if(act==='explore-tab'){state.exploreTab=value;renderMain()}
 else if(act==='element'){state.elementFilter=state.elementFilter===value?'':value;state.detailId=null;state.showLimit=16;renderMain()}
 else if(act==='clear-element'){state.elementFilter='';state.detailId=null;renderMain()}
 else if(act==='open-built'){state.exploreTab='biblioteca';state.search='';state.elementFilter='';state.family='Todas';state.detailId=value;state.showLimit=compounds.filter(c=>c.category===state.category).findIndex(c=>c.id===value)+1;renderMain()}
 else if(act==='practice-hard'){const worst=weakestFamily();if(worst){state.category=worst.category;state.family=worst.family;state.section='name';state.exercise=null;render()}}
 else if(act==='lesson'){state.lesson=Number(value);render();}
 else if(act==='quiz'){
  const i=Number(value);state.quizAnswers[state.lesson]=i;
  if(i===lessons[state.lesson].quiz[2]&&!progress.completedLessons.includes(state.lesson)){progress.completedLessons.push(state.lesson);persist()}
  render();
 }else if(act==='retry-quiz'){delete state.quizAnswers[state.lesson];renderMain()}
 else if(act==='next'){state.exercise=null;newExercise();renderMain()}
 else if(act==='hint'){state.hints=Math.min(3,state.hints+1);state.entered=document.getElementById('answer')?.value||state.entered;renderMain()}
 else if(act==='reveal'){
  if(!state.exercise||state.locked)return;const c=compounds.find(x=>x.id===state.exercise.id);
  updateStats(c,'skipped');state.entered=document.getElementById('answer')?.value||state.entered;state.answerState={type:'reveal'};state.locked=true;render();
 }else if(act==='insert')doInsert(value);
 else if(act==='detail'){state.detailId=value;renderExploreResults()}
 else if(act==='more'){state.showLimit+=16;renderExploreResults()}
 else if(act==='random-explore'){
  const pool=compounds.filter(c=>c.category===state.category&&(state.family==='Todas'||c.family===state.family));const candidate=choose(pool);
  if(candidate){state.search='';state.detailId=candidate.id;state.showLimit=Math.max(16,pool.findIndex(c=>c.id===candidate.id)+1);renderMain()}
 }else if(act==='practice-detail')detailPractice(value);
 else if(act==='reset-progress'){
  if(window.confirm('¿Borrar el progreso de formulación inorgánica guardado en este navegador?')){progress=blankProgress();state.quizAnswers={};persist();render()}
 }
});
document.addEventListener('change',event=>{
 const key=event.target.dataset.setting;if(!key)return;
 state[key]=event.target.value;state.exercise=null;state.recent=[];renderMain();
});
document.addEventListener('input',event=>{
 if(event.target.id==='periodicSearch'){
  const q=normName(event.target.value.trim());
  document.querySelectorAll('.element-box').forEach(el=>{el.classList.toggle('dimmed',!!q&&!normName(el.dataset.search).includes(q));});
 }
 if(event.target.id==='answer')state.entered=event.target.value;
 if(event.target.id==='exploreSearch'){state.search=event.target.value;state.showLimit=16;state.detailId=null;renderExploreResults()}
});
document.addEventListener('submit',event=>{if(event.target.id==='answer-form'){event.preventDefault();checkAnswer()}});
/* Comenzamos por los fundamentos, antes de aprender las familias. */
state.lesson=0;
render();
</script>
</body>
</html>
